<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d12">
<link rel="manifest" href="manifest.webmanifest">
<title>Symbiosis</title>
<style>
  :root {
    --bg:#101014; --card:#16161c; --line:#2a2a36; --text:#ececf4;
    --dim:#8b8b9c; --pink:#ff2d78; --cyan:#3ee0d4; --on:#1c1c24;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; margin:0; }
  body {
    background:var(--bg); color:var(--text);
    font:15px/1.35 -apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column;
    overflow:hidden;
    padding-top:48px;
    transition:background .2s ease, color .2s ease;
  }
  header {
    display:flex; align-items:center; gap:6px;
    padding:6px 12px 0;
  }
  header h1 { font-size:22px; font-weight:700; margin:0; flex:1; display:flex; align-items:center; gap:8px; }
  header h1 svg { width:28px; height:28px; flex:0 0 28px; }
  .boot {
    position:absolute; inset:0; z-index:20; background:#101014;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transition:opacity .45s ease;
  }
  .boot.go { opacity:0; pointer-events:none; }
  .boot .mark { width:88px; height:88px; animation:spin-mark 1.1s ease-in-out infinite; }
  .boot p { color:var(--dim); margin:14px 0 0; font-size:13px; }
  @keyframes spin-mark {
    0% { transform:rotate(-8deg) scale(.92); }
    50% { transform:rotate(8deg) scale(1); }
    100% { transform:rotate(-8deg) scale(.92); }
  }
  .iconbtn {
    min-width:36px; height:36px; border-radius:12px; border:1px solid var(--line);
    background:#1c1c26; color:var(--text); font-size:13px; padding:0 9px;
    transition:transform .12s ease, background .12s ease, opacity .12s ease;
  }
  .iconbtn:active { transform:scale(.96); background:var(--on); }
  .search {
    margin:10px 12px 6px; display:flex; align-items:center; gap:10px;
    border:1px solid var(--line); border-radius:22px; padding:0 14px; height:42px;
  }
  .search input {
    flex:1; border:0; outline:0; background:transparent; color:var(--text);
    font:inherit; min-width:0;
  }
  .search input::placeholder { color:var(--dim); }
  .status {
    margin:0 12px 6px; border:1px solid var(--line); border-radius:12px;
    padding:8px 10px; font-size:12.5px; color:var(--dim);
  }
  .status .line { color:var(--text); font-weight:600; margin-bottom:4px; }
  .chips { display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; }
  .chip {
    flex:0 0 auto; border:1px solid var(--line); border-radius:999px;
    padding:3px 10px; font-size:12px; color:var(--text);
  }
  .chip.tap { color:var(--cyan); }
  .list {
    flex:1; overflow:auto; padding:0 6px 110px;
    -webkit-overflow-scrolling:touch;
  }
  .game {
    display:flex; align-items:stretch; gap:12px;
    margin:6px; padding:8px; border-radius:16px; border:1px solid var(--line);
    background:var(--card);
    transition:background .12s ease, transform .12s ease, opacity .18s ease;
  }
  .game:active { background:var(--on); transform:scale(.985); }
  .thumb {
    width:64px; height:64px; border-radius:12px; flex:0 0 64px;
    background:linear-gradient(145deg,#2a1630,#16222a);
    overflow:hidden; display:flex; align-items:center; justify-content:center;
    color:var(--pink); font-size:20px;
    align-self:center;
  }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .meta { flex:1; min-width:0; align-self:center; }
  .title { font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sub { color:var(--dim); font-size:12px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .stats { margin-top:3px; font-size:12px; color:var(--cyan); }
  .play { margin-right:8px; }
  .shot {
    width:72px; height:40px; border-radius:8px; flex:0 0 72px;
    background:#111; overflow:hidden; align-self:center;
  }
  .shot img { width:100%; height:100%; object-fit:cover; display:block; }
  .addons {
    flex:0 1 42%; max-width:46%; min-width:0;
    border-left:1px solid var(--line); padding:2px 0 2px 8px;
  }
  .addon-name { color:var(--cyan); font-size:11px; font-weight:600; }
  .addon-file {
    display:block; width:100%; text-align:left;
    background:transparent; border:0; color:var(--dim);
    font:11px/1.3 inherit; padding:3px 0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .empty { color:var(--dim); text-align:center; padding:40px 20px; }
  .fabs {
    position:absolute; right:16px; bottom:72px;
    display:flex; gap:8px; z-index:4;
  }
  .fab {
    height:48px; padding:0 16px; border:0; border-radius:24px;
    background:var(--pink); color:#fff; font:600 14px/48px inherit;
    transition:transform .12s ease, opacity .12s ease;
  }
  .fab:active { transform:scale(.97); }
  .fab.ghost {
    background:#1c1c26; color:var(--text); border:1px solid var(--line);
  }
  .bar {
    position:absolute; left:12px; right:12px; bottom:14px;
    border:1px solid var(--line); border-radius:12px;
    background:#16161c; padding:8px 12px; font-size:12.5px; color:var(--dim);
    z-index:4;
  }
  .bar b { color:var(--text); }
  .sheet {
    display:flex; position:absolute; inset:0; background:rgba(0,0,0,.55);
    z-index:6; align-items:flex-end;
    opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity .18s ease, visibility .18s ease;
  }
  .sheet.on { opacity:1; visibility:visible; pointer-events:auto; }
  .sheet .box {
    width:100%; background:#14141a; border-radius:18px 18px 0 0;
    padding:16px 16px 24px; max-height:80%; overflow:auto;
    transform:translateY(18px);
    transition:transform .18s ease;
  }
  .sheet.on .box { transform:translateY(0); }
  .sheet h2 { margin:0 0 10px; font-size:16px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  button.ghost {
    background:transparent; color:var(--cyan); border:1px solid var(--line);
    border-radius:10px; padding:10px 12px; font:600 13px inherit;
    transition:transform .12s ease, background .12s ease;
  }
  button.ghost:active { transform:scale(.97); background:var(--on); }
  .note { color:var(--dim); font-size:12.5px; margin-top:8px; word-break:break-all; }
  .note pre {
    white-space:pre-wrap; word-break:break-word;
    margin:8px 0 0; font:12px/1.4 ui-monospace,monospace; color:var(--text);
  }
  .plug {
    border:1px solid var(--line); border-radius:12px;
    padding:8px 10px; margin:6px 0;
    display:flex; gap:8px; align-items:center;
  }
  .plug .nm { flex:1; min-width:0; }
  .plug .nm b { display:block; }
  .logline {
    border-top:1px solid var(--line); padding:7px 0;
    font-size:12.5px;
  }
  .logline .ok { color:var(--cyan); }
  .logline .bad { color:var(--pink); }
  .logline .wh { color:var(--dim); font-size:11px; margin-top:2px; }

  .tabs { display:flex; gap:6px; margin:8px 12px 0; }
  .tab {
    flex:1; height:36px; border-radius:12px; border:1px solid var(--line);
    background:#1c1c26; color:var(--dim); font:600 14px inherit;
    transition:background .15s ease, color .15s ease, transform .12s ease;
  }
  .tab.on { background:var(--on); color:var(--text); }
  .view { display:none; flex:1; min-height:0; flex-direction:column; overflow:hidden; }
  .view.on { display:flex; }
  .conv-list { flex:1; overflow:auto; padding:0 6px 110px; }
  .card {
    display:flex; gap:12px; align-items:center;
    margin:6px; padding:8px; border-radius:16px; border:1px solid var(--line);
    background:var(--card);
    transition:transform .12s ease, background .12s ease;
  }
  .card:active { transform:scale(.985); }
  .card .go { background:var(--pink); color:#fff; border:0; border-radius:10px; padding:8px 12px; font:600 13px inherit; }
  .card .bad { color:var(--pink); }
  .card .ok { color:var(--cyan); }

  .tools { display:flex; gap:6px; margin:0 12px 6px; overflow-x:auto; }
  .tools button {
    flex:0 0 auto; height:30px; border-radius:999px; border:1px solid var(--line);
    background:#1c1c26; color:var(--dim); font:600 12px inherit; padding:0 12px;
  }
  .tools button.on { background:var(--on); color:var(--text); }
  .tid { font:11px/1.3 ui-monospace,monospace; color:var(--dim); margin-top:2px; }
  .chip.x { padding-right:6px; }
  .chip .rm { color:var(--pink); margin-left:6px; border:0; background:transparent; font:700 13px inherit; }
  .tog { display:flex; gap:10px; align-items:center; border-top:1px solid var(--line); padding:8px 0; }
  .tog .nm { flex:1; min-width:0; }
  .tog .nm b { display:block; font-size:13px; }
  .tog .nm span { color:var(--dim); font-size:11.5px; }
  .sw {
    min-width:52px; height:30px; border-radius:999px; border:1px solid var(--line);
    background:#1c1c26; color:var(--dim); font:700 11px inherit;
  }
  .sw.on { background:var(--cyan); color:#062; border-color:transparent; }
  .res { display:flex; align-items:center; gap:8px; margin:8px 0; }
  .gallery { display:flex; gap:8px; overflow-x:auto; margin-top:8px; }
  .gallery img { height:72px; border-radius:8px; }

  #view-launch { min-height:0; }
  .rail-wrap {
    position:relative; flex:0 0 42%; min-height:160px;
    display:flex; align-items:center;
  }
  .rail {
    flex:1; min-width:0; height:100%;
    display:flex; align-items:center; gap:16px;
    overflow-x:auto; overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    padding:8px 18vw;
    scrollbar-width:none;
    /* Жест забирает сам railSwipe, а не браузер.
       Пока горизонталь полагалась на встроенную прокрутку, WebView на этом
       телефоне отдавал свайп мимо карусели: pan - x он понимает иначе, чем
       десктопный Chromium, и жест уходил в экран, а рельс стоял. Поэтому
       pan - x убран (с ним жест не доезжал), а остановку на плитке раньше
       делал scroll-snap, который дёргал карусель прямо во время свайпа.
       Теперь прокрутку и остановку делает JS, а браузеру запрещено трогать
       горизонталь здесь - иначе он снова решит, кому достаётся жест. */
    touch-action:none;
    overscroll-behavior-x:contain;
  }
  .rail::-webkit-scrollbar { display:none; }
  .slide {
    flex:0 0 min(42vw, 220px); width:min(42vw, 220px); height:min(42vw, 220px);
    scroll-snap-align:center;
    border-radius:22px; overflow:hidden;
    background:linear-gradient(160deg,#2a1630,#16222a);
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    color:var(--pink); font-size:42px; font-weight:700;
    transform:scale(.88); opacity:.55;
    transition:transform .18s ease, opacity .18s ease, box-shadow .18s ease;
    /* Обложка - картинка, а картинка в WebView тянется пальцем сама.
       Именно из-за этого свайп по карусели не сдвигал её, хотя полоса
       прокрутки была на месте. */
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  }
  /* Плитка в момент перетаскивания не едет за transform - иначе палец
     тащит картинку, а карусель стоит. Масштаб и прозрачность после
     отпускания возвращает snapTo. */
  .rail.dragging .slide { transition:none; }
  .slide.on { transform:scale(1); opacity:1; box-shadow:0 12px 40px rgba(0,0,0,.45); }
  .slide img {
    width:100%; height:100%; object-fit:cover; display:block;
    pointer-events:none; -webkit-user-drag:none; -webkit-touch-callout:none;
  }
  .navb {
    position:absolute; top:50%; transform:translateY(-50%);
    z-index:3; width:40px; height:40px; border-radius:20px;
    border:1px solid var(--line); background:#1c1c26cc; color:var(--text);
    font:700 22px/40px inherit; padding:0;
  }
  .navb.l { left:8px; }
  .navb.r { right:8px; }
  .dock {
    flex:1 1 auto; min-height:0;
    margin:0 10px 10px; padding:10px 12px 12px;
    border:1px solid var(--line); border-radius:18px;
    background:#14141c;
    display:flex; flex-direction:column; overflow:hidden;
  }
  .dock-head { flex:0 0 auto; }
  .dock-body { flex:1 1 auto; min-height:0; overflow:auto; }
  .dock h2 { margin:0 0 2px; font-size:18px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dock .who { color:var(--dim); font-size:12px; margin-bottom:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* Сколько игр в библиотеке всего: без этого карусель из одной плитки
     читается как «у меня одна игра», а полосы прокрутки у рельса нет. */
  .dock .pos { color:var(--cyan); font-size:12px; font-weight:700; margin-bottom:6px; }
  .facts { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; }
  .fact {
    border:1px solid var(--line); border-radius:10px;
    padding:6px 8px; flex:1 1 30%; min-width:28%; max-width:100%;
  }
  .fact b { display:block; font-size:11px; color:var(--dim); font-weight:600; }
  .fact span { display:block; font-size:13px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dock .go {
    width:100%; height:44px; border:0; border-radius:14px;
    background:var(--pink); color:#fff; font:700 15px inherit; margin-top:6px;
  }
  .dock .go:active { transform:scale(.98); }
  .dock-shots { display:flex; gap:8px; overflow-x:auto; margin-top:8px; }
  .dock-shots img { height:56px; border-radius:8px; flex:0 0 auto; }
  .tabs { gap:4px; }

  .spaces {
    display:flex; gap:6px; margin:6px 12px 0;
  }
  .space {
    flex:1; min-height:52px; border-radius:14px; border:1px solid var(--line);
    background:#1c1c26; color:var(--dim); text-align:left; padding:8px 10px;
    font:inherit;
  }
  .space b { display:block; color:var(--text); font-size:14px; }
  .space span { display:block; font-size:11px; margin-top:2px; }
  .space.on { border-color:var(--cyan); background:var(--on); color:var(--text); }
  body.space-kenji .space.on { border-color:#7b3fe4; }

  #view-kenji { display:none; flex:1; min-height:0; flex-direction:column; overflow:hidden; }
  #view-kenji.on { display:flex; }
  .k-top {
    display:flex; align-items:center; gap:8px; margin:8px 12px 6px;
  }
  .k-logo {
    width:42px; height:42px; border-radius:12px; flex:0 0 42px;
    background:#2a2a32; color:#ff4d4d; font:800 22px/42px inherit; text-align:center;
  }
  .k-search {
    flex:1; height:42px; border-radius:12px; border:1px solid var(--line);
    background:#1a1a20; color:var(--text); padding:0 12px; font:inherit;
  }
  .k-grid {
    flex:1; overflow:auto; padding:4px 10px 96px;
    display:grid; grid-template-columns:repeat(auto-fill, minmax(132px, 1fr));
    gap:12px; align-content:start;
  }
  .k-tile {
    border:0; background:transparent; padding:0; color:inherit; text-align:left;
  }
  .k-cover {
    width:100%; aspect-ratio:1; border-radius:16px; overflow:hidden;
    background:linear-gradient(160deg,#2a1630,#16222a);
    display:flex; align-items:center; justify-content:center;
    color:var(--pink); font-size:28px; font-weight:700;
  }
  .k-cover img { width:100%; height:100%; object-fit:cover; display:block; }
  .k-tile .nm {
    margin-top:6px; font-size:12px; font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .k-add {
    border:1px dashed var(--line); border-radius:16px;
    aspect-ratio:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    color:var(--dim); font-size:13px; background:#16161c;
  }
  .k-add b { font-size:32px; font-weight:400; color:var(--text); }
  .k-bar {
    position:absolute; left:12px; right:12px; bottom:14px;
    display:flex; gap:8px; align-items:center;
    border:1px solid var(--line); border-radius:12px;
    background:#16161c; padding:8px 10px; font-size:12px; color:var(--dim);
    z-index:4;
  }
  .k-bar button { flex:0 0 auto; }
  body.space-kenji #view-launch, body.space-kenji #view-games { display:none !important; }
  body.space-kenji .tabs { display:none; }

  @media (orientation: landscape) {
    body { padding-top:28px; }
    header { padding:2px 10px 0; }
    header h1 { font-size:18px; }
    .tabs { margin:4px 10px 0; }
    .tab { height:30px; font-size:13px; }
    #view-launch { flex-direction:row; align-items:stretch; }
    .rail-wrap { flex:0 0 36%; max-width:320px; min-height:0; }
    .rail { padding:6px 44px; }
    .slide {
      flex:0 0 min(28vh, 180px); width:min(28vh, 180px); height:min(28vh, 180px);
    }
    .dock { flex:1; margin:6px 10px 8px 0; max-height:none; }
    .navb { width:34px; height:34px; font-size:18px; line-height:34px; }
    .dock h2 { font-size:16px; }
    .dock .go { height:40px; }
  }
</style>
</head>
<body>
<div class="boot" id="boot">
  <svg class="mark" viewBox="0 0 108 108" aria-hidden="true">
    <circle cx="54" cy="54" r="22" fill="none" stroke="#3EE0D4" stroke-width="4.5"/>
    <path fill="#FF2D78" d="M54 32l12 38-12-8-12 8z"/>
    <circle cx="54" cy="54" r="5" fill="#ececf4"/>
  </svg>
  <p>Symbiosis</p>
</div>
<header>
  <h1>
    <svg viewBox="0 0 108 108" aria-hidden="true">
      <circle cx="54" cy="54" r="22" fill="none" stroke="#3EE0D4" stroke-width="4.5"/>
      <path fill="#FF2D78" d="M54 32l12 38-12-8-12 8z"/>
      <circle cx="54" cy="54" r="5" fill="#ececf4"/>
    </svg>
    Symbiosis
  </h1>
  <button class="iconbtn" id="btn-engines">Ядра</button>
  <button class="iconbtn" id="btn-plugins">Плагины</button>
  <button class="iconbtn" id="btn-reload" title="Обновить интерфейс">↻</button>
  <button class="iconbtn" id="btn-tools">Утилиты</button>
  <button class="iconbtn" id="btn-settings">Настройки</button>
</header>
<div class="spaces" id="spaces">
  <button class="space on" id="sp-symbiosis" data-id="symbiosis" type="button">
    <b>Symbiosis</b><span>основное ядро · наша оболочка</span>
  </button>
  <button class="space" id="sp-kenji" data-id="kenji" type="button">
    <b>Kenji-NX</b><span>их оболочка · ядро или их APK</span>
  </button>
</div>
<div class="tabs">
  <button class="tab on" id="tab-launch">Лаунчер</button>
  <button class="tab" id="tab-games">Список</button>
  <button class="tab" id="tab-conv">Конвертер</button>
</div>
<div class="view on" id="view-launch">
  <div class="rail-wrap">
    <button class="navb l" id="ln-prev" type="button">‹</button>
    <div class="rail" id="rail"></div>
    <button class="navb r" id="ln-next" type="button">›</button>
  </div>
  <div class="dock" id="dock"><div class="empty">нет игр</div></div>
</div>
<div class="view" id="view-games">
<div class="search">
  <span style="color:var(--cyan)">⌕</span>
  <input id="q" placeholder="Найти игру…" autocomplete="off">
</div>
<div class="tools" id="tools">
  <button data-sort="name" class="on">Имя</button>
  <button data-sort="recent">Недавно</button>
  <button data-sort="play">Время</button>
  <button data-filter="all" class="on">Все</button>
  <button data-filter="save">Сейв</button>
  <button data-filter="mod">Мод</button>
  <button data-filter="fresh">Не играли</button>
</div>
<div class="status" id="status">
  <div class="line" id="status-line">Ключи · Прошивка · Игры</div>
  <div class="chips" id="chips"></div>
  <div class="line" id="mem" style="margin-top:6px;font-weight:400"></div>
</div>
<div class="list" id="list"><div class="empty">загрузка…</div></div>
<div class="fabs">
  <button class="fab ghost" id="fab-saves">Сейвы</button>
  <button class="fab" id="fab">＋ Папка</button>
</div>
<div class="bar" id="bar">папка не выбрана</div>
</div>

<div class="view" id="view-kenji">
  <div class="k-top">
    <div class="k-logo" aria-hidden="true">R</div>
    <input class="k-search" id="k-q" placeholder="Search…" autocomplete="off">
    <button class="iconbtn" id="k-gear" title="Настройки">⚙</button>
  </div>
  <div class="k-grid" id="k-grid"><div class="empty">нет игр</div></div>
  <div class="k-bar" id="k-bar">
    <span id="k-status">пространство Kenji</span>
    <button class="ghost" id="k-dl">Скачать ядро</button>
    <button class="ghost" id="k-ext">Их APK</button>
    <button class="ghost" id="k-plug">Встроить оболочку</button>
  </div>
</div>
<div class="view" id="view-conv">
  <div class="status" style="margin-top:10px">
    <div class="line">NSZ · XCZ · NCZ → NSP / NCA</div>
    Сжатый файл не запускается. После конвертации — обложка и «Запустить» или «Удалить».
  </div>
  <div class="conv-list" id="conv-list"><div class="empty">добавьте файл</div></div>
  <div class="fabs">
    <button class="fab" id="fab-conv">＋ Файл</button>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="box">
    <h2 id="sheet-title">Игра</h2>
    <div class="note" id="sheet-note"></div>
    <div class="row" style="margin-top:12px" id="sheet-actions"></div>
  </div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
const N = () => window.Symbiosis || null;
function call(name, ...a) {
  try { const n=N(); return n && n[name] ? n[name](...a) : null; } catch(e) { return null; }
}
function parse(s, fb) { try { return s ? JSON.parse(s) : fb; } catch(e) { return fb; } }

let GAMES = [];
let HOLD = null;
let SAVES = { path:'', titles:0, name:'', size:'' };
let SORT = localStorage.getItem('eden-sort') || 'name';
let FILTER = localStorage.getItem('eden-filter') || 'all';

let LAUNCH_I = 0;
let RAIL_LIST = [];
// Состав плиток последней сборки: пустая строка - «ещё не собирали».
let RAIL_SIG = '';

function sortGames(list) {
  return list.sort((a,b) => {
    if (SORT === 'recent') return (b.lastPlayed||0) - (a.lastPlayed||0) || (a.title||'').localeCompare(b.title||'','ru');
    if (SORT === 'play') return (b.playSeconds||0) - (a.playSeconds||0) || (a.title||'').localeCompare(b.title||'','ru');
    return (a.title||'').localeCompare(b.title||'','ru');
  });
}

// «Список»: поиск и чипы-фильтры относятся только к этой вкладке.
function visibleGames() {
  const qEl = $('q');
  const q = qEl ? (qEl.value || '').trim().toLowerCase() : '';
  let list = GAMES.slice();
  if (q) list = list.filter(g => (g.title||'').toLowerCase().includes(q) || (g.developer||'').toLowerCase().includes(q) || (g.titleId||'').toLowerCase().includes(q));
  if (FILTER === 'save') list = list.filter(g => g.hasSave);
  if (FILTER === 'mod') list = list.filter(g => (g.addons||[]).some(a => a && a.enabled !== false));
  if (FILTER === 'fresh') list = list.filter(g => !g.playSeconds && !g.lastPlayed);
  return sortGames(list);
}

// «Лаунчер»: вся библиотека, всегда.
//
// Раньше здесь стоял visibleGames(), и вкладка «Список» могла урезать
// карусель до одной игры: остальные становились недоступны для запуска из
// лаунчера, а «не прокручивается» выглядело как «их тут нет».
function railGames() {
  return sortGames(GAMES.slice());
}

function progressOf(g) {
  if (!g) return 'нет данных';
  if (g.hasSave) return 'есть сейв' + (g.saveSize ? ' · ' + g.saveSize : '');
  if (g.playSeconds) return 'играли, сейва нет';
  return 'не начато';
}

function render() {
  const list = visibleGames();
  if (!N()) {
    $('list').innerHTML = '<div class="empty">Откройте из APK Eden</div>';
    return;
  }
  if (!list.length) {
    if (GAMES.length) {
      $('list').innerHTML = '<div class="empty">ничего не найдено</div>';
      return;
    }
    const folders = parse(call('folders'), { folders: [] }).folders || [];
    const bytes = folders.reduce((n, f) => n + (f.bytes || 0), 0);
    const hint = folders.length
      ? ('Папка «' + (folders[0].name || 'игры') + '» есть' +
         (folders[0].size ? ' · ' + folders[0].size : '') +
         ', но игр нет. Если ключи ✕ — сначала ключи, не сканер.')
      : 'Нет игр в кэше. Добавьте папку снизу.';
    $('list').innerHTML = '<div class="empty">' + hint +
      '<div style="margin-top:14px"><button class="ghost" id="btn-find">Найти игры</button></div></div>';
    const b = $('btn-find');
    if (b) b.onclick = findGames;
    return;
  }
  $('list').innerHTML = list.map(g => {
    const i = GAMES.indexOf(g);
    const save = g.hasSave ? (' · сейв ' + (g.saveSize || 'есть')) : '';
    const addons = (g.addons || []).filter(a => a && a.enabled !== false);
    const side = addons.length ? `<div class="addons">${addons.map(a => {
      const files = (a.files || []).map(f =>
        `<button class="addon-file" data-path="${esc(f.path)}" data-name="${esc(f.name)}">${esc(f.name)}</button>`
      ).join('');
      return `<div class="addon-name">${esc(a.kind === 'cheat' ? 'чит' : 'мод')} · ${esc(a.name)}</div>${files}`;
    }).join('')}</div>` : '';
    const bits = [];
    if (g.play) bits.push(g.play);
    if (g.lastPlayedLabel) bits.push(g.lastPlayedLabel);
    if (g.shots) bits.push('фото ' + g.shots);
    if (g.shaderSize) bits.push('шейдеры ' + g.shaderSize);
    const stats = bits.length ? `<div class="stats">${bits.map(b => `<span class="play">${esc(b)}</span>`).join('')}</div>` : '';
    const shot = g.lastShot ? `<div class="shot" id="sh-${i}" data-shot="1"></div>` : '';
    const tid = g.titleId ? `<div class="tid" data-tid="${esc(g.titleId)}">${esc(g.titleId)}${g.fileSize ? ' · ' + esc(g.fileSize) : ''}${g.version ? ' · ' + esc(g.version) : ''}</div>` : '';
    return `<div class="game" data-i="${i}">
      <div class="thumb" id="ic-${i}">▶</div>
      <div class="meta">
        <div class="title">${esc(g.title || 'без имени')}</div>
        <div class="sub">${esc(g.developer || '')}${save}</div>
        ${stats}
        ${tid}
      </div>
      ${shot}
      ${side}
    </div>`;
  }).join('');
  $('list').querySelectorAll('.game').forEach(el => {
    const g = GAMES[+el.dataset.i];
    el.addEventListener('click', ev => {
      if (ev.target.closest('.addon-file')) return;
      if (ev.target.closest('[data-shot]')) { ev.stopPropagation(); openShots(g); return; }
      const tidEl = ev.target.closest('[data-tid]');
      if (tidEl && tidEl.dataset.tid) {
        ev.stopPropagation();
        copyTid(tidEl.dataset.tid);
        return;
      }
      play(g);
    });
    el.addEventListener('contextmenu', ev => { ev.preventDefault(); holdMenu(g); });
    let t = 0;
    el.addEventListener('touchstart', () => { t = Date.now(); }, {passive:true});
    el.addEventListener('touchend', ev => {
      if (t && Date.now() - t > 480) { ev.preventDefault(); holdMenu(g); }
      t = 0;
    });
  });
  $('list').querySelectorAll('.addon-file').forEach(btn => {
    btn.addEventListener('click', ev => {
      ev.stopPropagation();
      openAddonFile(btn.dataset.path, btn.dataset.name);
    });
  });
  list.forEach(g => {
    const i = GAMES.indexOf(g);
    setTimeout(() => fillIcon(i, g.path), 30 * i);
    if (g.lastShot) setTimeout(() => fillShot(i, g.lastShot), 40 * i);
  });
}

function fillIcon(i, path) {
  const el = $('ic-' + i);
  if (!el || !N() || typeof N().icon !== 'function') return;
  const b64 = call('icon', path);
  if (b64) el.innerHTML = '<img alt="" src="data:image/jpeg;base64,' + b64 + '">';
}

function fillShot(i, path) {
  const el = $('sh-' + i);
  if (!el || !path || !N() || typeof N().shot !== 'function') return;
  const b64 = call('shot', path);
  if (b64) el.innerHTML = '<img alt="" src="data:image/jpeg;base64,' + b64 + '">';
  else el.remove();
}

function play(g) {
  if (!g || !g.path || !N() || !N().launch) return;
  const eng = parse(call('engines'), null);
  if (eng && eng.current && eng.current !== eng.launch) {
    HOLD = g;
    $('sheet-title').textContent = g.title || 'Игра';
    $('sheet-note').textContent = 'Второе ядро выбрано, но файл не скачан. Скачайте в Ядрах или запустите на основном.';
    $('sheet-actions').innerHTML = '<button class="go" id="a-go">Основное ядро</button><button class="ghost" id="a-eng">Скачать ядро</button><button class="ghost" id="a-close">Отмена</button>';
    $('a-go').onclick = () => { closeSheet(); N().launch(g.path, g.title || ''); };
    $('a-eng').onclick = () => { closeSheet(); if (N().openEngines) N().openEngines(); };
    $('a-close').onclick = closeSheet;
    openSheet();
    return;
  }
  const mem = parse(call('memory'), null);
  if (mem && mem.warn) {
    HOLD = g;
    $('sheet-title').textContent = g.title || 'Игра';
    $('sheet-note').textContent = mem.note || ('осталось ' + mem.leftMb + ' МБ — лучше не запускать');
    $('sheet-actions').innerHTML = '<button class="ghost" id="a-go">Всё равно запустить</button><button class="ghost" id="a-close">Отмена</button>';
    $('a-go').onclick = () => { closeSheet(); N().launch(g.path, g.title || ''); };
    $('a-close').onclick = closeSheet;
    openSheet();
    return;
  }
  N().launch(g.path, g.title || '');
}

function holdMenu(g) {
  HOLD = g;
  $('sheet-title').textContent = g.title || 'Игра';
  const bits = [];
  if (g.play) bits.push('время ' + g.play);
  if (g.lastPlayedLabel) bits.push(g.lastPlayedLabel);
  if (g.shots) bits.push('фото ' + g.shots);
  if (g.fileSize) bits.push(g.fileSize);
  if (g.titleId) bits.push(g.titleId);
  if (g.hasSave) bits.push('сейв ' + (g.saveSize || 'найден'));
  const addons = (g.addons || []).filter(a => a && a.enabled !== false);
  if (addons.length) bits.push(addons.map(a => (a.kind === 'cheat' ? 'чит' : 'мод') + ' «' + a.name + '»').join(', '));
  $('sheet-note').textContent = bits.join(' · ');
  $('sheet-actions').innerHTML = `
    <button class="ghost" id="a-props">Свойства</button>
    <button class="ghost" id="a-shots">Фото</button>
    <button class="ghost" id="a-tid">Копировать TitleID</button>
    <button class="ghost" id="a-aaa-g">AAA минимум</button>
    <button class="ghost" id="a-sh">Кешировать шейдеры</button>
    <button class="ghost" id="a-close">Закрыть</button>`;
  $('a-props').onclick = () => { closeSheet(); if (N() && N().openGameMenu) N().openGameMenu(g.path); };
  $('a-shots').onclick = () => openShots(g);
  $('a-tid').onclick = () => copyTid(g.titleId || '');
  $('a-aaa-g').onclick = () => {
    const r = parse(call('applyAaaMode'), { message: 'нет моста — нужен новый APK' });
    $('sheet-note').textContent = r.message || '';
  };
  $('a-sh').onclick = () => cacheShaders();
  $('a-close').onclick = closeSheet;
  openSheet();
}

function cacheShaders() {
  const r = parse(call('prepareShaders'), { note: 'нет моста' });
  $('sheet-note').textContent = (r.note || '') + (r.size ? ' Сейчас на диске: ' + r.size : '');
}

function openAddonFile(path, name) {
  if (!path) return;
  const r = parse(call('readText', path), null);
  $('sheet-title').textContent = name || 'файл';
  if (!r || !r.ok) {
    $('sheet-note').textContent = (r && r.reason) || 'не открылся';
    $('sheet-actions').innerHTML = `<button class="ghost" id="a-close">Закрыть</button>`;
  } else {
    $('sheet-note').innerHTML = '<pre>' + esc(r.text || '') + '</pre>';
    $('sheet-actions').innerHTML = `<button class="ghost" id="a-close">Закрыть</button>`;
  }
  $('a-close').onclick = closeSheet;
  openSheet();
}

function openSheet() { $('sheet').classList.add('on'); }
function closeSheet() { $('sheet').classList.remove('on'); }

function findGames() {
  if (N() && N().keysOk && !N().keysOk()) {
    if ($('btn-find')) $('btn-find').textContent = 'нет ключей';
    return;
  }
  if (N() && N().rescan) N().rescan();
  const btn = $('btn-find');
  if (btn) btn.textContent = 'ищу…';
  let n = 0;
  const tmr = setInterval(() => {
    n++;
    loadGames();
    loadStatus();
    if (GAMES.length || n > 20) {
      clearInterval(tmr);
      if (!GAMES.length && $('btn-find')) $('btn-find').textContent = 'ещё раз';
    }
  }, 700);
}


function copyTid(tid) {
  if (!tid) return;
  const done = () => { $('bar').textContent = 'TitleID ' + tid; };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(tid).then(done).catch(done);
  } else done();
}

function openShots(g) {
  if (!g) return;
  const data = parse(call('shots', g.path, g.title || ''), { items: [] });
  const items = data.items || [];
  $('sheet-title').textContent = (g.title || 'игра') + ' · фото';
  if (!items.length) {
    $('sheet-note').textContent = 'кадров на диске нет — выйдите из игры один раз';
    $('sheet-actions').innerHTML = '<button class="ghost" id="a-close">Закрыть</button>';
    $('a-close').onclick = closeSheet;
    openSheet();
    return;
  }
  $('sheet-note').innerHTML = '<div class="gallery">' + items.map((it, i) =>
    `<img alt="" id="gal-${i}" data-path="${esc(it.path)}">`
  ).join('') + '</div><div class="note">' + items.length + ' файл(ов) в screenshots</div>';
  $('sheet-actions').innerHTML = '<button class="ghost" id="a-close">Закрыть</button>';
  $('a-close').onclick = closeSheet;
  openSheet();
  items.forEach((it, i) => {
    setTimeout(() => {
      const el = $('gal-' + i);
      if (!el) return;
      const b64 = call('shot', it.path);
      if (b64) el.src = 'data:image/jpeg;base64,' + b64;
    }, 40 * i);
  });
}


// Полосы прокрутки у рельса нет, а прокручивать его приходится жестом или
// кнопками. Позицию считаем сами: scrollIntoView прокручивает всех предков
// подряд, и страница уезжала вбок вместе с каруселью.
function railCentre(el, smooth) {
  const rail = $('rail');
  if (!rail || !el) return;
  const left = Math.max(0, el.offsetLeft - (rail.clientWidth - el.offsetWidth) / 2);
  if (smooth && typeof rail.scrollTo === 'function') {
    rail.scrollTo({ left: left, behavior: 'smooth' });
    // Плавная прокрутка в WebView на 8 ГБ то едет, то молча не делает
    // ничего: выделение уезжало на соседнюю плитку, а карусель оставалась
    // там, где палец отпустили. Через 350 мс проверяем и, если не доехало,
    // ставим плитку в центр сразу.
    setTimeout(() => {
      if (rail && Math.abs(rail.scrollLeft - left) > 2) rail.scrollLeft = left;
    }, 350);
  } else {
    rail.scrollLeft = left;
  }
}

// Пока карусель едет сама, её события прокрутки не выбирают новую плитку:
// плавная прокрутка на 8 ГБ идёт дольше, чем кажется, и слушатель
// успевал поставить выделение на предыдущую.
let RAIL_BUSY_UNTIL = 0;

function renderLauncher() {
  const rail = $('rail'), dock = $('dock');
  if (!rail || !dock) return;
  const keepPath = RAIL_LIST[LAUNCH_I] ? RAIL_LIST[LAUNCH_I].path : '';
  RAIL_LIST = railGames();
  if (keepPath) {
    const same = RAIL_LIST.findIndex(g => g.path === keepPath);
    LAUNCH_I = same >= 0 ? same : 0;
  }
  if (!RAIL_LIST.length) {
    rail.innerHTML = '';
    RAIL_SIG = '';
    dock.innerHTML = '<div class="empty">нет игр — откройте Список и добавьте папку</div>';
    return;
  }
  if (LAUNCH_I >= RAIL_LIST.length) LAUNCH_I = 0;
  if (LAUNCH_I < 0) LAUNCH_I = RAIL_LIST.length - 1;

  // Тот же набор игр - не пересобирать рельс заново.
  //
  // loadGames() зовётся из опроса findGames() каждые 700 мс, и каждый раз
  // пересобирал innerHTML и возвращал карусель на выбранную плитку. Палец
  // был на середине свайпа - рельс под ним менялся и возвращался назад.
  // Пересобираем только когда изменился сам состав библиотеки.
  const sig = RAIL_LIST.map(g => g.path).join('\n');
  if (sig === RAIL_SIG && rail.children.length) {
    paintDock();
    return;
  }
  RAIL_SIG = sig;

  rail.innerHTML = RAIL_LIST.map((g, i) => {
    const gi = GAMES.indexOf(g);
    return `<div class="slide${i===LAUNCH_I?' on':''}" data-ri="${i}" id="cvl-${gi}">▶</div>`;
  }).join('');
  rail.querySelectorAll('.slide').forEach(el => {
    el.addEventListener('click', () => {
      const i = +el.dataset.ri;
      if (i === LAUNCH_I) play(RAIL_LIST[i]);
      else snapTo(i);
    });
  });
  paintDock();
  RAIL_LIST.forEach((g, i) => {
    const gi = GAMES.indexOf(g);
    setTimeout(() => fillCover(gi, g.path), 40 * i);
  });
  requestAnimationFrame(() => railCentre(rail.querySelector('.slide.on'), false));
}

function fillCover(gi, path) {
  const el = $('cvl-' + gi);
  if (!el || !path) return;
  const fn = (N() && typeof N().cover === 'function') ? 'cover' : 'icon';
  const b64 = call(fn, path);
  // draggable=false обязателен: без него WebView начинает тянуть картинку
  // пальцем раньше, чем до неё дойдёт свайп, и карусель не едет.
  if (b64) el.innerHTML = '<img alt="" draggable="false" src="data:image/jpeg;base64,' + b64 + '">';
}

function snapTo(i) {
  if (!RAIL_LIST.length) return;
  const n = RAIL_LIST.length;
  LAUNCH_I = ((i % n) + n) % n;
  const rail = $('rail');
  if (!rail) return;
  rail.querySelectorAll('.slide').forEach(el => el.classList.toggle('on', +el.dataset.ri === LAUNCH_I));
  const el = rail.querySelector('.slide.on');
  if (el) {
    RAIL_BUSY_UNTIL = Date.now() + 450;
    railCentre(el, true);
  }
  paintDock();
}

function nearestSlide() {
  if (Date.now() < RAIL_BUSY_UNTIL) return;
  const rail = $('rail');
  if (!rail) return;
  const mid = rail.scrollLeft + rail.clientWidth / 2;
  let best = 0, dist = 1e9;
  rail.querySelectorAll('.slide').forEach(el => {
    const c = el.offsetLeft + el.offsetWidth / 2;
    const d = Math.abs(c - mid);
    if (d < dist) { dist = d; best = +el.dataset.ri; }
  });
  if (best !== LAUNCH_I) {
    LAUNCH_I = best;
    rail.querySelectorAll('.slide').forEach(el => el.classList.toggle('on', +el.dataset.ri === LAUNCH_I));
    paintDock();
  }
}

function paintDock() {
  const dock = $('dock');
  if (!dock) return;
  const g = RAIL_LIST[LAUNCH_I];
  if (!g) { dock.innerHTML = '<div class="empty">нет игр</div>'; return; }
  const addons = (g.addons || []).filter(a => a && a.enabled !== false);
  const mods = addons.length
    ? addons.map(a => esc((a.kind === 'cheat' ? 'чит' : 'мод') + ' · ' + (a.name || ''))).join('<br>')
    : 'нет включённых';
  dock.innerHTML = `
    <div class="dock-head">
      <h2>${esc(g.title || 'без имени')}</h2>
      <div class="who">${esc(g.developer || '')}${g.titleId ? ' · ' + esc(g.titleId) : ''}${g.fileSize ? ' · ' + esc(g.fileSize) : ''}${g.version ? ' · ' + esc(g.version) : ''}</div>
      <div class="pos">${LAUNCH_I + 1} / ${RAIL_LIST.length}</div>
      <button class="go" id="dock-go">Запустить</button>
    </div>
    <div class="dock-body">
      <div class="facts">
        <div class="fact"><b>время</b><span>${esc(g.play || 'ещё не играли')}</span></div>
        <div class="fact"><b>запуск</b><span>${esc(g.lastPlayedLabel || 'никогда')}</span></div>
        <div class="fact"><b>прохождение</b><span>${esc(progressOf(g))}</span></div>
        <div class="fact"><b>сейв</b><span>${g.hasSave ? esc(g.saveSize || 'есть') : 'нет (слоты NEW GAME)'}</span></div>
        <div class="fact"><b>фото</b><span>${g.shots || 0}</span></div>
        <div class="fact"><b>шейдеры</b><span>${esc(g.shaderSize || 'пусто')}</span></div>
      </div>
      <div class="fact" style="width:100%"><b>моды / читы</b><span>${mods}</span></div>
      <div class="dock-shots" id="dock-shots"></div>
      <div class="row" style="margin-top:8px">
        <button class="ghost" id="dock-core">Ядро: Eden</button>
        <button class="ghost" id="dock-cpu">CPU: —</button>
        <button class="ghost" id="dock-shots-btn">Все фото</button>
        <button class="ghost" id="dock-props">Свойства</button>
        <button class="ghost" id="dock-aaa">AAA минимум</button>
      </div>
    </div>`;
  $('dock-go').onclick = () => play(g);
  $('dock-shots-btn').onclick = () => openShots(g);
  $('dock-props').onclick = () => { if (N() && N().openGameMenu) N().openGameMenu(g.path); };
  $('dock-aaa').onclick = () => {
    const r = parse(call('applyAaaMode'), { message: 'нет моста' });
    const f = dock.querySelector('.who');

  if ($('dock-cpu')) $('dock-cpu').onclick = ev => { ev.stopPropagation(); cycleCpu(); };

}

function paintCores() {
  const eng = parse(call('engines'), { currentLabel: 'Eden', launchLabel: 'Eden' });
  const set = parse(call('settings'), { cpuLabel: '' });
  const core = $('dock-core');
  if (core) {
    const same = (eng.current || 'eden') === (eng.launch || 'eden');
    core.textContent = same
      ? ('Ядро: ' + (eng.currentLabel || 'Eden'))
      : ('Ядро: ' + (eng.currentLabel || '?') + ' · игры: ' + (eng.launchLabel || 'Eden'));
  }
  const cpu = $('dock-cpu');
  if (cpu) cpu.textContent = 'CPU: ' + (set.cpuLabel || '—');

function cycleEngine() {
  openEnginesSheet();
}

function engineActions(it) {
  const btns = [];
  if (it.state === 'missing' || it.state === 'broken') {
    btns.push('<button class="ghost e-dl" data-id="' + esc(it.id) + '">Скачать</button>');
  }
  if (it.state === 'ready') {
    btns.push('<button class="ghost e-probe" data-id="' + esc(it.id) + '">Проверить</button>');
  }
  if (it.usable && !it.selected) {
    btns.push('<button class="ghost e-sel" data-id="' + esc(it.id) + '">Выбрать</button>');
  }
  if (it.usable) {
    btns.push('<button class="go e-run" data-id="' + esc(it.id) + '">Запустить</button>');
  }
  if (it.state === 'ready') {
    btns.push('<button class="ghost e-rm" data-id="' + esc(it.id) + '">Удалить</button>');
  }
  return btns.join('');
}

function openEnginesSheet(note) {
  HOLD = null;
  const eng = parse(call('engines'), { items: [], note: '' });

      '<div class="nm"><b>' + esc(it.label || it.id) + mark + play + '</b>' +
      '<span style="color:var(--dim);font-size:12px">' + esc(it.note || it.state || '') + '</span></div></div>' +
      '<div class="row" style="margin:0 0 10px">' + engineActions(it) + '</div>';
  }).join('') : '<div class="empty" style="padding:12px">мост ядер не ответил — нужен новый APK</div>';
  $('sheet-note').innerHTML =
    '<div class="note">Скачать · Проверить · Запустить. Второе ядро (~55 МБ) живёт отдельным плеером: если упадёт, лаунчер останется.</div>' +
    cards +
    (note ? '<div class="logline"><div class="' + (String(note).indexOf('Не ') === 0 || String(note).indexOf('не ') === 0 ? 'bad' : 'ok') + '">' + esc(note) + '</div></div>' : '');
  $('sheet-actions').innerHTML =
    '<button class="ghost" id="a-eng-native">Открыть экран ядер</button>' +
    '<button class="ghost" id="a-close">Закрыть</button>';

  };

  $('sheet-note').querySelectorAll('.e-dl').forEach(b => {
    b.onclick = ev => { ev.stopPropagation(); startEngineDownload(b.dataset.id); };
  });
  $('sheet-note').querySelectorAll('.e-probe').forEach(b => {
    b.onclick = ev => { ev.stopPropagation(); startEngineProbe(b.dataset.id); };
  });
  $('sheet-note').querySelectorAll('.e-sel').forEach(b => {
    b.onclick = ev => {
      ev.stopPropagation();
      const r = parse(call('selectEngine', b.dataset.id), { message: 'нет моста' });
      openEnginesSheet(r.message || '');
      paintCores();
    };
  });

    b.onclick = ev => { ev.stopPropagation(); launchWithEngine(b.dataset.id); };
  });
  $('sheet-note').querySelectorAll('.e-rm').forEach(b => {
    b.onclick = ev => {
      ev.stopPropagation();
      const r = parse(call('removeEngine', b.dataset.id), { message: 'нет моста' });
      openEnginesSheet(r.message || '');

function startEngineDownload(id) {
  if (!N() || !N().downloadEngine) {
    if (N() && N().openEngines) N().openEngines();
    return;
  }
  $('sheet-note').innerHTML = '<div class="note" id="eng-status">Скачиваю второе ядро…</div>';
  $('sheet-actions').innerHTML = '<button class="ghost" id="a-close">Скрыть</button>';
  $('a-close').onclick = closeSheet;
  N().downloadEngine(id);
}

function startEngineProbe(id) {
  if (!N() || !N().probeEngine) {
    if (N() && N().openEngines) N().openEngines();
    return;
  }
  $('sheet-note').innerHTML = '<div class="note" id="eng-status">Проверяю ядро в отдельном процессе…</div>';

  $('a-close').onclick = closeSheet;

}

function launchWithEngine(id) {
  const r = parse(call('selectEngine', id), { message: 'нет моста' });
  if (!r.ok) {
    openEnginesSheet(r.message || 'ядро не выбралось');
    paintCores();
    if (r.needDownload) startEngineDownload(id);
    return;
  }
  const g = RAIL_LIST[LAUNCH_I] || GAMES[0];
  if (g && g.path && N() && N().launch) {
    closeSheet();
    paintCores();
    N().launch(g.path, g.title || '');
    return;
  }
  openEnginesSheet((r.message || 'ядро выбрано') + ' · откройте игру на лаунчере и нажмите Запустить');
  paintCores();
}

function onEngineProgress(info) {
  const el = $('eng-status');
  if (!el || !info) return;
  const done = info.done || 0;
  const total = info.total || 0;
  el.textContent = total > 0
    ? ('Скачиваю… ' + Math.floor(done / 1048576) + ' из ' + Math.floor(total / 1048576) + ' МБ')
    : ('Скачиваю… ' + Math.floor(done / 1048576) + ' МБ');
}

function onEngineDone(info) {
  paintCores();
  openEnginesSheet((info && info.message) || (info && info.ok ? 'скачано' : 'не скачалось'));
}

function onEngineProbe(info) {
  const msg = info && info.message ? info.message : 'нет ответа';
  openEnginesSheet(info && info.ok ? ('Ядро запускается: ' + msg) : ('Не запустилось: ' + msg));

function cycleCpu() {
  const r = parse(call('cycleCpu'), { message: 'нет моста' });
  const dock = $('dock');

}

function fillDockShots(g) {
  const box = $('dock-shots');
  if (!box || !g) return;
  const data = parse(call('shots', g.path, g.title || ''), { items: [] });
  const items = (data.items || []).slice(0, 8);
  if (!items.length) {
    box.innerHTML = g.lastShot ? '' : '<div class="note" style="margin:0">скринов нет — выйдите из игры один раз</div>';
    if (g.lastShot) {
      const img = document.createElement('img');
      img.alt = '';
      box.appendChild(img);
      const b64 = call('shot', g.lastShot);
      if (b64) img.src = 'data:image/jpeg;base64,' + b64;
    }
    return;
  }
  box.innerHTML = items.map((it, i) => `<img alt="" id="ds-${i}">`).join('');
  items.forEach((it, i) => {
    setTimeout(() => {
      const el = $('ds-' + i);
      if (!el) return;
      const b64 = call('shot', it.path);
      if (b64) el.src = 'data:image/jpeg;base64,' + b64;
    }, 30 * i);
  });
}

        : ('память: свободно ' + mem.leftMb + ' МБ · занято ' + (mem.usedMb || 0) + ' / ' + (mem.budgetMb || 0));
      mk.style.color = mem.warn ? 'var(--pink)' : 'var(--dim)';
    } else mk.textContent = '';
  }
}

function applyPlugins() {
  let p;
  try { p = parse(call('pluginPayload'), null); } catch (e) { return; }
  if (!p) return;
  try {
  const root = document.documentElement;
  Object.keys(p.theme || {}).forEach(k => {
    try { root.style.setProperty(k, p.theme[k]); } catch (e) {}
  });
  let st = document.getElementById('plugin-css');
  if (!st) {
    st = document.createElement('style');
    st.id = 'plugin-css';
    document.head.appendChild(st);
  }
  st.textContent = p.css || '';
  document.querySelectorAll('[data-plugin-hide]').forEach(el => {
    el.style.removeProperty('display');
    el.removeAttribute('data-plugin-hide');
  });
  (p.hide || []).forEach(sel => {
    try {
      document.querySelectorAll(sel).forEach(el => {
        el.setAttribute('data-plugin-hide', '1');
        el.style.display = 'none';
      });
    } catch (e) {}
  });
  document.querySelectorAll('[data-plugin-html]').forEach(el => el.remove());
  (p.html || []).forEach(item => {
    const at = String(item.at || '');
    const html = item.html || '';
    if (!at || !html) return;
    try {
      const wrap = document.createElement('div');
      wrap.setAttribute('data-plugin-html', '1');
      wrap.innerHTML = html;
      if (at.startsWith('after:')) {
        const t = document.querySelector(at.slice(6));
        if (t && t.parentNode) t.parentNode.insertBefore(wrap, t.nextSibling);
      } else if (at.startsWith('before:')) {
        const t = document.querySelector(at.slice(7));
        if (t && t.parentNode) t.parentNode.insertBefore(wrap, t);
      } else {
        const t = document.querySelector(at);
        if (t) t.appendChild(wrap);
      }
    } catch (e) {}
  });
  const strings = p.strings || {};
  if (strings['Search games…'] && $('q')) $('q').placeholder = strings['Search games…'];
  } catch (e) {}
}

function reloadUi() {
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.update()));
    }
    if (window.caches) {
      caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k)))).catch(()=>{});
    }
  } catch (e) {}
  if (N() && N().reloadInterface) {
    N().reloadInterface();
    return;
  }
  location.reload();
}

function showTab(id) {
  ['launch','games','conv'].forEach(k => {
    const tab = $('tab-' + k), view = $('view-' + k);
    if (tab) tab.classList.toggle('on', k === id);
    if (view) view.classList.toggle('on', k === id);
  });
  if (id === 'conv') loadConverter();
  if (id === 'launch') {
    if (!$('rail') || !$('rail').children.length) renderLauncher();
    else railCentre($('rail').querySelector('.slide.on'), false);
  }
  try { localStorage.setItem('eden-tab', id); } catch (e) {}
}

function loadConverter() {
  const data = parse(call('converterItems'), { items: [] });
  const items = data.items || [];
  if (!items.length) {
    $('conv-list').innerHTML = '<div class="empty">Нет файлов. «＋ Файл» — nsz, xcz, ncz или уже готовый nsp/xci.</div>';
    return;
  }
  $('conv-list').innerHTML = items.map((it, i) => {
    const can = !!it.canLaunch;
    const btn = can
      ? `<button class="go" data-act="play" data-i="${i}">Запустить</button>`
      : `<button class="ghost" data-act="del" data-i="${i}">Удалить</button>`;
    return `<div class="card">
      <div class="thumb" id="cv-${i}">▶</div>
      <div class="meta">
        <div class="title">${esc(it.title || it.name || 'файл')}</div>
        <div class="sub ${can ? 'ok' : 'bad'}">${can ? 'можно открыть' : esc(it.reason || 'не открывается')} · ${esc(it.size || '')}</div>
      </div>
      ${btn}
    </div>`;
  }).join('');
  $('conv-list').querySelectorAll('button[data-act]').forEach(b => {
    const it = items[+b.dataset.i];
    b.onclick = ev => {
      ev.stopPropagation();
      if (b.dataset.act === 'play') {
        if (it && it.path && N() && N().launch) N().launch(it.path, it.title || '');
      } else {
        parse(call('deleteConverted', it.path), null);
        loadConverter();
      }
    };
  });
  items.forEach((it, i) => {
    if (!it.canLaunch || !it.path) return;
    setTimeout(() => {
      const el = $('cv-' + i);
      if (!el || !N() || typeof N().icon !== 'function') return;
      const b64 = call('icon', it.path);
      if (b64) el.innerHTML = '<img alt="" src="data:image/jpeg;base64,' + b64 + '">';
    }, 40 * i);
  });
}

function onConverted(info) {
  showTab('conv');
  loadConverter();
  if (info && info.message) {
    const note = document.createElement('div');
    note.className = 'status';
    note.innerHTML = '<div class="line">' + esc(info.message) + '</div>' +
      (info.reason && !info.canLaunch ? esc(info.reason) : '');
    $('conv-list').prepend(note);
  }
}

$('tab-launch').onclick = () => showTab('launch');
$('tab-games').onclick = () => showTab('games');
$('tab-conv').onclick = () => showTab('conv');
$('fab-conv').onclick = () => { if (N() && N().pickConvert) N().pickConvert(); };


function paintTools() {
  const bar = $('tools');
  if (!bar) return;
  bar.querySelectorAll('[data-sort]').forEach(b => b.classList.toggle('on', b.dataset.sort === SORT));
  bar.querySelectorAll('[data-filter]').forEach(b => b.classList.toggle('on', b.dataset.filter === FILTER));
}
const toolsEl = $('tools');
if (toolsEl) {
  toolsEl.addEventListener('click', ev => {
    const b = ev.target.closest('button');
    if (!b) return;
    if (b.dataset.sort) { SORT = b.dataset.sort; localStorage.setItem('eden-sort', SORT); }
    if (b.dataset.filter) { FILTER = b.dataset.filter; localStorage.setItem('eden-filter', FILTER); }
    paintTools();
    render();
    renderLauncher();
  });
  paintTools();
}


const railEl = $('rail');
if (railEl) {
  let st = 0;
  railEl.addEventListener('scroll', () => {
    clearTimeout(st);
    st = setTimeout(nearestSlide, 80);
  }, {passive:true});
}

// ── Свайп по рельсу ──────────────────────────────────────────────────────
//
// Жест намеренно не отдан встроенной прокрутке. Разбор жеста в WebView на
// этом телефоне уводил его в экран: карусель стояла, а страница дёргалась.
// Здесь палец разбираем сами - pointermove с preventDefault, положение
// ставим в scrollLeft сами и останавливаемся на плитке сами. Побочный
// эффект, который обязателен: после свайпа не должен срабатывать click по
// плитке, иначе каталог листается и тут же запускает игру.
const RAIL_SLIDE_GAP = 16;      // .rail gap, в сумме со шириной плитки это шаг
const RAIL_TAP_SLOP = 10;       // меньше - это тап, а не перетаскивание
const RAIL_FLICK_SPEED = 0.45;  // px/мс, после которых свайп считается броском
const RAIL_FLICK_STEP = 1;      // на сколько плиток уходит бросок

let RAIL_DRAG = null;
let RAIL_SUPPRESS_CLICK = false;

function railNearestIndex() {
  const rail = $('rail');
  if (!rail) return 0;
  const mid = rail.scrollLeft + rail.clientWidth / 2;
  let best = 0, dist = Infinity;
  rail.querySelectorAll('.slide').forEach(el => {
    const c = el.offsetLeft + el.offsetWidth / 2;
    const d = Math.abs(c - mid);
    if (d < dist) { dist = d; best = +el.dataset.ri; }
  });
  return best;
}

function railRelease() {
  const d = RAIL_DRAG;
  RAIL_DRAG = null;
  const rail = $('rail');
  if (!rail || !d) return;
  rail.classList.remove('dragging');
  const moved = Math.abs(d.lastX - d.x0) > RAIL_TAP_SLOP;
  if (moved) {
    // Клик по плитке после свайпа запустил бы игру. Флаг живёт до конца
    // цикла событий, в который прилетит click.
    RAIL_SUPPRESS_CLICK = true;
    setTimeout(() => { RAIL_SUPPRESS_CLICK = false; }, 0);
  }
  const dt = Math.max(1, d.tLast - d.t0);
  const vx = (d.lastX - d.x0) / dt;   // px/мс, минус = палец вправо
  const steps = Math.abs(vx) > RAIL_FLICK_SPEED ? RAIL_FLICK_STEP : 0;
  const base = d.startI;
  // Бросок вправо (палец вправо, vx отрицательный) листает к предыдущей
  // плитке: карусель едет вместе с пальцем, а не навстречу ему.
  const flick = steps ? base - Math.sign(vx) * steps : 0;
  snapTo(flick || railNearestIndex());
}

function bindRailSwipe(rail) {
  if (!rail || rail.dataset.swipe === 'on') return;
  rail.dataset.swipe = 'on';
  rail.addEventListener('pointerdown', ev => {
    if (!ev.isPrimary) { RAIL_DRAG = null; return; }
    RAIL_DRAG = { x0: ev.clientX, y0: ev.clientY, lastX: ev.clientX,
                  startLeft: rail.scrollLeft, startI: LAUNCH_I,
                  t0: ev.timeStamp, tLast: ev.timeStamp, moved: false };
    rail.classList.add('dragging');
    try { rail.setPointerCapture(ev.pointerId); } catch (e) { /* не критично */ }
  });
  rail.addEventListener('pointermove', ev => {
    const d = RAIL_DRAG;
    if (!d) return;
    if (Math.abs(ev.clientY - d.y0) > RAIL_TAP_SLOP &&
        Math.abs(ev.clientY - d.y0) > Math.abs(ev.clientX - d.x0)) {
      railRelease();          // жест вертикальный - это не наш
      return;
    }
    d.moved = true;
    d.lastX = ev.clientX;
    d.tLast = ev.timeStamp;
    // preventDefault здесь и есть смысл touch-action:none: без него
    // браузер сам уводит страницу вбок, пока палец тянет карусель.
    if (ev.cancelable) ev.preventDefault();
    const max = Math.max(0, rail.scrollWidth - rail.clientWidth);
    rail.scrollLeft = Math.min(max, Math.max(0, d.startLeft - (ev.clientX - d.x0)));
  });
  ['pointerup', 'pointercancel'].forEach(t => rail.addEventListener(t, railRelease));
  rail.addEventListener('click', ev => {
    if (RAIL_SUPPRESS_CLICK) { ev.preventDefault(); ev.stopPropagation(); }
  }, true);
}

if (railEl) bindRailSwipe(railEl);

function keepLaunchFrame() {
  railCentre($('rail') && $('rail').querySelector('.slide.on'), false);
}
let rotT = 0;
window.addEventListener('resize', () => {
  clearTimeout(rotT);
  rotT = setTimeout(keepLaunchFrame, 40);
});
window.addEventListener('orientationchange', () => {
  keepLaunchFrame();
  setTimeout(keepLaunchFrame, 80);
});

if ($('ln-prev')) $('ln-prev').onclick = () => snapTo(LAUNCH_I - 1);
if ($('ln-next')) $('ln-next').onclick = () => snapTo(LAUNCH_I + 1);

// «Влево-вправо» с клавиатуры: у лаунчера нет сфокусированного поля, и без
// этого стрелки на аппаратной клавиатуре или в Bluetooth-игре не двигали
// карусель вообще.
document.addEventListener('keydown', ev => {
  if (ev.key !== 'ArrowLeft' && ev.key !== 'ArrowRight') return;
  const view = $('view-launch');
  if (!view || !view.classList.contains('on')) return;
  const el = document.activeElement;
  if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')) return;
  ev.preventDefault();
  snapTo(LAUNCH_I + (ev.key === 'ArrowRight' ? 1 : -1));
});

let SPACE = 'symbiosis';

function paintSpaces(info) {
  const data = info || parse(call('spaces'), { current: SPACE, items: [] });
  SPACE = data.current || 'symbiosis';
  document.body.classList.toggle('space-kenji', SPACE === 'kenji');
  ['symbiosis', 'kenji'].forEach(id => {
    const el = $('sp-' + id);
    if (el) el.classList.toggle('on', SPACE === id);
  });
  const kenji = (data.items || []).find(it => it.id === 'kenji') || {};
  const off = data.official || {};
  const spk = $('sp-kenji');
  if (spk) {
    const sub = spk.querySelector('span');
    if (sub) {
      sub.textContent = off.installed
        ? ('их APK «' + (off.label || 'Kenji') + '» · оболочка здесь')
        : (kenji.ready ? 'ядро скачано · наш плеер' : 'скачайте ядро или поставьте их APK');
    }
  }
  const kv = $('view-kenji');
  if (kv) kv.classList.toggle('on', SPACE === 'kenji');
  if (SPACE === 'kenji') {
    renderKenjiGrid();
    paintKenjiBar(data);
  }
}

function paintKenjiBar(data) {
  const st = $('k-status');
  const dl = $('k-dl');
  const ext = $('k-ext');
  if (!st) return;
  const off = (data && data.official) || {};
  const core = data && data.kenjiCore;
  if (off.installed) {
    st.textContent = 'их APK «' + (off.label || 'Kenji') + '» · игры уходят туда';
  } else if (core === 'ready') {
    st.textContent = 'их APK нет · наш плеер в :kenji';
  } else if (core === 'broken') {
    st.textContent = 'файл ядра битый — скачайте снова';
  } else {
    st.textContent = 'нет ядра и нет их APK — скачайте или поставьте Kenji';
  }
  if (dl) dl.style.display = (core === 'ready') ? 'none' : '';
  if (ext) {
    ext.textContent = off.installed ? 'Открыть их APK' : 'Их APK не стоит';
    ext.disabled = !off.installed;
  }
}

function renderKenjiGrid() {
  const box = $('k-grid');
  if (!box) return;
  const q = (($('k-q') && $('k-q').value) || '').trim().toLowerCase();
  const list = (q ? GAMES.filter(g => (g.title || '').toLowerCase().includes(q)) : GAMES.slice());
  const add = '<button class="k-add" id="k-add" type="button"><b>+</b>папка</button>';
  if (!list.length) {
    box.innerHTML = add + '<div class="empty" style="grid-column:1/-1">нет игр — добавьте папку</div>';
    const a = $('k-add');
    if (a) a.onclick = () => { if (N() && N().pickFolder) N().pickFolder(); };
    return;
  }
  box.innerHTML = add + list.map(g => {
    const i = GAMES.indexOf(g);
    return '<button class="k-tile" data-i="' + i + '" type="button">' +
      '<div class="k-cover" id="kc-' + i + '">▶</div>' +
      '<div class="nm">' + esc(g.title || 'без имени') + '</div></button>';
  }).join('');
  const a = $('k-add');
  if (a) a.onclick = () => { if (N() && N().pickFolder) N().pickFolder(); };
  box.querySelectorAll('.k-tile').forEach(el => {
    const g = GAMES[+el.dataset.i];
    el.onclick = () => play(g);
  });
  list.forEach(g => {
    const i = GAMES.indexOf(g);
    setTimeout(() => {
      const el = $('kc-' + i);
      if (!el) return;
      const b64 = call('cover', g.path) || call('icon', g.path);
      if (b64) el.innerHTML = '<img alt="" src="data:image/jpeg;base64,' + b64 + '">';
    }, 30 * Math.max(0, list.indexOf(g)));
  });
}

function applySpace(id) {
  if (!N() || !N().selectSpace) {
    SPACE = id;
    paintSpaces({ current: id, items: [] });
    return;
  }
  const r = parse(call('selectSpace', id), { message: 'нет моста' });
  applyPlugins();
  paintSpaces();
  if (r && r.message) {
    const bar = $('k-status') || $('bar');
    if (bar) bar.textContent = r.message;
  }
}

function loadSpaces() {
  paintSpaces();
}

$('q').addEventListener('input', render);
$('fab').onclick = () => { if (N() && N().pickFolder) N().pickFolder(); };
$('fab-saves').onclick = pickSaves;
$('btn-engines').onclick = () => openEnginesSheet();
$('btn-tools').onclick = () => { if (N() && N().openUtilities) N().openUtilities(); };
$('btn-settings').onclick = openSettingsSheet;
$('btn-plugins').onclick = openPluginsSheet;
$('btn-reload').onclick = reloadUi;
if ($('sp-symbiosis')) $('sp-symbiosis').onclick = () => applySpace('symbiosis');
if ($('sp-kenji')) $('sp-kenji').onclick = () => applySpace('kenji');
if ($('k-q')) $('k-q').addEventListener('input', renderKenjiGrid);
if ($('k-gear')) $('k-gear').onclick = openSettingsSheet;
if ($('k-dl')) $('k-dl').onclick = () => startEngineDownload('kenji');
if ($('k-ext')) $('k-ext').onclick = () => {
  const g = RAIL_LIST[LAUNCH_I] || GAMES[0] || { path: '', title: '' };
  const r = parse(call('openOfficialKenji', g.path || ''), { message: 'нет моста' });
  const st = $('k-status');
  if (st) st.textContent = r.message || '';
};
if ($('k-plug')) $('k-plug').onclick = () => {
  const r = parse(call('installKenjiShell'), { message: 'нет моста' });
  applyPlugins();
  paintSpaces();
  const st = $('k-status');
  if (st) st.textContent = r.message || 'оболочка';
};
$('sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
loadGames();
loadStatus();
applyPlugins();
loadSpaces();
setTimeout(() => { const b = $('boot'); if (b) b.classList.add('go'); }, 700);
setTimeout(() => { const b = $('boot'); if (b) b.remove(); }, 1200);
try {
  const tab = localStorage.getItem('eden-tab') || 'launch';
  if (tab === 'games' || tab === 'conv' || tab === 'launch') showTab(tab);
} catch (e) {}

</script>
