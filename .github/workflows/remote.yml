name: Remote session

# A remote desktop (RDP) or terminal (SSH) on a GitHub runner, reachable from a
# phone. Both are tunnelled out through ngrok, because a runner has no public
# address of its own.
#
# WHAT YOU NEED ONCE, FOR RDP:
#   An ngrok authtoken - free from https://dashboard.ngrok.com/get-started/your-authtoken
#   Save it as a repository secret named NGROK_AUTH_TOKEN:
#     Settings -> Secrets and variables -> Actions -> New repository secret
#   Without it, RDP cannot be exposed and the job stops with an explanation
#   rather than pretending to work. SSH mode needs no token at all.
#
# HONEST LIMITS - read before relying on this:
#   * A job is killed after 6 hours. Nothing on the runner survives it.
#   * The desktop is XFCE with no GPU. Fine for a file manager, an editor and a
#     browser; useless for the Android emulator, which would run under software
#     rendering on two cores.
#   * A phone on mobile data will find RDP sluggish. SSH mode stays responsive
#     on a bad connection, which is why it is the default.
#   * Free ngrok gives one simultaneous TCP tunnel, so one RDP session at a
#     time. Several SSH sessions can run at once.
#
# CONNECTING FROM A PHONE:
#   RDP - Microsoft Remote Desktop, or aFreeRDP. Host and port are printed in
#         the log; user "runner", password shown in the same step.
#
# KEEPING THE CONNECTION SAVED ON YOUR PHONE
#   Three repository secrets pin what would otherwise change every session:
#     RDP_USER          login for the Windows session   (default zenrdp)
#     RDP_PASSWORD      its password, reused each run
#     NGROK_TCP_ADDRESS a reserved address, e.g. 1.tcp.eu.ngrok.io:12345
#
#   The port is already fixed at 3389 and never varies.
#
#   The address is the one thing that cannot be pinned for free: ngrok assigns
#   TCP addresses randomly on the free plan and reserving one requires the
#   Hobbyist or Pay-as-you-go plan. Without that secret the session still
#   works - the address is simply new each time, and the panel always shows the
#   current one.
#   SSH - Termux, JuiceSSH or ConnectBot. The web link works with no client.
#   A mouse over OTG works in both; RDP also takes touch as a mouse.

on:
  workflow_dispatch:
    inputs:
      os:
        description: "Runner OS"
        type: choice
        options: [linux, windows]
        default: linux
      mode:
        description: "Session type (Linux only; a Windows session is always RDP)"
        type: choice
        options: [web, ssh, rdp, both]
        default: web
      prepare_build:
        description: "Check out Eden and apply the patch first"
        type: boolean
        default: true
      label:
        description: "Name for this session, so several runs are told apart"
        type: string
        default: "session-1"

permissions:
  contents: write

jobs:
  remote:
    if: inputs.os == 'linux'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          path: fork

      - name: Name this session
        run: |
          echo "### Session: ${{ inputs.label }} (${{ inputs.mode }})" >> "$GITHUB_STEP_SUMMARY"
          echo "Started $(date -u '+%Y-%m-%d %H:%M UTC'), killed after 6 hours." >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare a build environment
        if: inputs.prepare_build
        run: |
          # Done before the session opens so you attach to a runner that can
          # already build, rather than typing ten minutes of setup on a phone.
          git clone --branch v0.2.1 https://git.eden-emu.dev/eden-emu/eden.git eden
          sudo apt-get update -qq
          sudo apt-get install -y glslang-tools libfmt-dev tmux htop
          cd eden
          bash "$GITHUB_WORKSPACE/fork/tools/apply_patch.sh" \
            --patch "$GITHUB_WORKSPACE/fork/patch" --eden "$GITHUB_WORKSPACE/eden"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        if: inputs.prepare_build

      - name: Install NDK and CMake
        if: inputs.prepare_build
        run: sdkmanager --install "ndk;28.2.13676358" "cmake;3.31.6" "build-tools;35.0.0" "platforms;android-36"

      - name: Install opencode and set up autosave
        run: |
          # opencode is a terminal coding agent; installed here so the session
          # opens with it ready rather than waiting on npm over a phone.
          npm install -g opencode-ai@latest >/dev/null 2>&1 || \
            echo "::warning::opencode install failed; the session still works without it."
          command -v opencode >/dev/null && opencode --version || true

          # The runner is destroyed when the job ends, so anything not pushed is
          # lost. A dedicated branch keeps work safe without touching main: a
          # commit every two minutes, and one final commit on the way out.
          cd "$GITHUB_WORKSPACE/fork"
          git config user.email "session@symbiosis"
          git config user.name  "Runner session"
          BRANCH="session/${{ inputs.label }}-$(date -u +%Y%m%d-%H%M)"
          git checkout -b "$BRANCH"
          git push -q -u origin "$BRANCH" 2>/dev/null || true
          echo "SESSION_BRANCH=$BRANCH" >> "$GITHUB_ENV"

          cat > "$HOME/autosave.sh" <<'AS'
          #!/bin/bash
          # Commits and pushes whatever changed, every two minutes. Quiet on
          # purpose: a failed push must not spam a terminal someone is working
          # in, and the next cycle retries anyway.
          cd "$1" || exit 1
          while true; do
            sleep 120
            if [ -n "$(git status --porcelain)" ]; then
              git add -A
              git commit -q -m "autosave $(date -u '+%H:%M:%S')" >/dev/null 2>&1
              git push -q origin HEAD >/dev/null 2>&1
            fi
          done
          AS
          # The heredoc above is indented inside the YAML block, so every line
          # carries leading spaces - fatal for the shebang. Remove them.
          sed -i 's/^          //' "$HOME/autosave.sh"
          chmod +x "$HOME/autosave.sh"
          nohup "$HOME/autosave.sh" "$GITHUB_WORKSPACE/fork" >/tmp/autosave.log 2>&1 &
          echo "autosave running on branch $BRANCH"

      - name: Write the cheat sheet
        run: |
          cat > "$HOME/README-session.txt" <<'EOF'
          Eden Symbiosis - runner session
          ===============================
          Where things are:
            ~/work/symbiosis/eden   upstream v0.2.1, patch applied
            ~/work/symbiosis/fork   this repository

          Build the APK:
            cd ~/work/symbiosis/eden/src/android
            ./gradlew assembleLegacyDebug --parallel --max-workers=$(nproc)
          Result: app/build/outputs/apk/legacy/debug/app-legacy-debug.apk

          Take it off the runner - it dies with the session:
            curl -F "file=@<apk>" https://store-eu-par-2.gofile.io/contents/uploadfile

          Run the tests:
            bash ~/work/symbiosis/fork/tools/run_tests.sh \
              --eden ~/work/symbiosis/eden

          Survive a dropped phone connection:
            tmux new -s work      # first time
            tmux attach -t work   # after reconnecting
          EOF
          cp "$HOME/README-session.txt" "$HOME/Desktop/" 2>/dev/null || true
          cat "$HOME/README-session.txt"

      - name: Desktop in the browser, on the fixed domain
        if: inputs.mode == 'web' || inputs.mode == 'both'
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
          NGROK_DOMAIN: filly-above-terrapin.ngrok-free.app
        run: |
          if [ -z "$NGROK_TOKEN" ]; then
            echo "::error::NGROK_AUTH_TOKEN is not set."
            echo "Add it: Settings -> Secrets and variables -> Actions -> New repository secret."
            echo "Token: https://dashboard.ngrok.com/get-started/your-authtoken"
            echo "Or re-run with mode: ssh, which needs no token."
            exit 1
          fi

          # Why a browser desktop rather than RDP on this domain:
          #
          # A free ngrok account gets one *static* domain, and it serves HTTP
          # only. RDP is raw TCP, which on the free tier lands on a random
          # 0.tcp.ngrok.io:PORT that changes every run - exactly the thing a
          # fixed address is meant to avoid. Serving the desktop over HTTP
          # keeps the address constant, and a browser needs no client app on
          # the phone at all.
          sudo apt-get update -qq
          sudo apt-get install -y xfce4 xfce4-terminal xfce4-goodies dbus-x11 \
                                  thunar mousepad tigervnc-standalone-server \
                                  novnc websockify tmux htop >/dev/null

          mkdir -p "$HOME/.vnc"
          # printf, not a heredoc: this run: block is indented inside the YAML,
          # and an indented heredoc writes those leading spaces into the file,
          # which leaves xstartup unrunnable and the desktop grey.
          printf '%s\n%s\n%s\n' \
            '#!/bin/sh' \
            'unset SESSION_MANAGER DBUS_SESSION_BUS_ADDRESS' \
            'exec dbus-launch startxfce4' > "$HOME/.vnc/xstartup"
          chmod +x "$HOME/.vnc/xstartup"

          PASS="$(openssl rand -hex 4)"
          printf '%s\n%s\n\n' "$PASS" "$PASS" | vncpasswd "$HOME/.vnc/passwd" >/dev/null 2>&1
          chmod 600 "$HOME/.vnc/passwd"

          # -localhost: the VNC port is never exposed directly. Everything goes
          # through websockify, which is what ngrok forwards.
          vncserver :1 -geometry 1280x720 -depth 24 -localhost yes >/dev/null 2>&1
          sleep 4

          websockify --web=/usr/share/novnc 6080 localhost:5901 \
            > /tmp/novnc.log 2>&1 &
          sleep 3

          # A browser terminal alongside the desktop. One ngrok tunnel is all a
          # free account gets, so both are served by nginx on the tunnelled
          # port: / is the desktop, /term/ is the shell.
          # Do not swallow this. Hiding the output meant a failed install went
          # unnoticed and /term/ answered 404 from websockify - nginx was never
          # running, so ngrok had been pointed at a port nothing served.
          sudo apt-get install -y ttyd nginx
          echo "ttyd:  $(command -v ttyd  || echo MISSING)"
          echo "nginx: $(command -v nginx || echo MISSING)"

          if command -v ttyd >/dev/null; then
            # -W allows writing; without it the terminal is read-only.
            nohup ttyd -p 7681 -W bash > /tmp/ttyd.log 2>&1 &
            sleep 2
            curl -sf -o /dev/null http://127.0.0.1:7681 \
              && echo "ttyd is serving on 7681" \
              || { echo "::warning::ttyd did not start"; tail -5 /tmp/ttyd.log; }
          fi

          sudo tee /etc/nginx/sites-available/session >/dev/null <<'NGINX'
          server {
            listen 8090;
            location / {
              proxy_pass http://127.0.0.1:6080;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_read_timeout 86400;
            }
            location /term/ {
              proxy_pass http://127.0.0.1:7681/;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_read_timeout 86400;
            }
          }
          NGINX
          sudo sed -i 's/^          //' /etc/nginx/sites-available/session
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo ln -sf /etc/nginx/sites-available/session /etc/nginx/sites-enabled/session
          # nginx ships a default site on port 80; harmless here, but the
          # config must still pass or the restart leaves the old one running.
          if sudo nginx -t; then
            sudo systemctl restart nginx
            sleep 2
            if curl -sf -o /dev/null http://127.0.0.1:8090/vnc.html; then
              echo "nginx is proxying the desktop on 8090"
            else
              echo "::error::nginx is up but 8090 does not serve the desktop."
              sudo ss -lntp | grep -E '8090|6080|7681' || true
              exit 1
            fi
          else
            echo "::error::nginx config rejected; the tunnel would serve nothing."
            sudo nginx -t
            exit 1
          fi

          curl -sL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz \
            | sudo tar xz -C /usr/local/bin
          # Validate the token before spending time on a desktop nobody can
          # reach. An ep_/ak_ prefix is a different ngrok credential entirely -
          # an endpoint or API key, not an agent authtoken - and produces
          # ERR_NGROK_105 several minutes later, long after the cause scrolls
          # past.
          case "$NGROK_TOKEN" in
            ep_*|ak_*)
              echo "::error::That looks like an ngrok endpoint or API key, not an agent authtoken."
              echo "An authtoken is ~49 characters and starts with a digit."
              echo "Copy it from https://dashboard.ngrok.com/get-started/your-authtoken"
              echo "(Your Authtoken -> Copy), then update the NGROK_AUTH_TOKEN secret."
              exit 1 ;;
          esac

          ngrok config add-authtoken "$NGROK_TOKEN"

          # Try the reserved domain first, then fall back to a generated one.
          #
          # The reserved domain is currently configured as a ngrok Cloud
          # Endpoint: it answers on its own with ngrok's default page, which
          # means it counts as already online and an agent cannot bind to it -
          # ERR_NGROK_334. Refusing to start in that case would leave no
          # desktop at all, so take the address ngrok hands out instead. The
          # session still works; only the address stops being predictable.
          ACTIVE_URL=""
          nohup ngrok http 8090 --url="https://$NGROK_DOMAIN" --log stdout \
            > /tmp/ngrok.log 2>&1 &
          sleep 8

          if grep -q "ERR_NGROK_105" /tmp/ngrok.log; then
            echo "::error::ngrok rejected the authtoken (ERR_NGROK_105)."
            echo "Replace NGROK_AUTH_TOKEN with the value from"
            echo "https://dashboard.ngrok.com/get-started/your-authtoken"
            exit 1
          fi

          if grep -q "ERR_NGROK_334" /tmp/ngrok.log; then
            echo "::warning::$NGROK_DOMAIN is already online as a Cloud Endpoint,"
            echo "so the agent cannot bind to it. Falling back to a generated address."
            echo "To use the fixed domain, delete the Cloud Endpoint for it at"
            echo "https://dashboard.ngrok.com/endpoints - the domain stays reserved."
            pkill -f "ngrok http" || true
            sleep 2
            nohup ngrok http 8090 --log stdout > /tmp/ngrok.log 2>&1 &
            sleep 8
          fi

          # Ask the local agent API what address it actually got, rather than
          # assuming: that is true for both paths above.
          for i in $(seq 1 20); do
            ACTIVE_URL=$(curl -s http://127.0.0.1:4040/api/tunnels 2>/dev/null \
              | python3 -c "import sys,json;t=json.load(sys.stdin).get('tunnels',[]);print(t[0]['public_url'] if t else '')" 2>/dev/null)
            [ -n "$ACTIVE_URL" ] && break
            sleep 2
          done

          if [ -z "$ACTIVE_URL" ]; then
            echo "::error::No tunnel came up. ngrok log follows."
            tail -25 /tmp/ngrok.log
            exit 1
          fi

          # An external SSH client would need a second tunnel: the one free
          # ngrok connection is already carrying HTTP, and a bare sshd on the
          # runner is unreachable from a phone. Rather than publish an address
          # that only resolves on the runner - which looks usable and is not -
          # the browser terminal at /term/ is the shell for this session, and
          # the separate "SSH session" workflow (tmate) is there when a real
          # client is wanted.
          SSH_CMD=""; SSH_PASS=""

          URL="$ACTIVE_URL/vnc.html?autoconnect=1&resize=remote&password=$PASS"
          {
            echo ""
            echo "## Desktop in the browser"
            echo ""
            echo "**[Open the desktop]($URL)**"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Address | \`$ACTIVE_URL\` |"
            echo "| VNC password | \`$PASS\` |"
            echo ""
            echo "| Terminal | [$ACTIVE_URL/term/]($ACTIVE_URL/term/) |"
            echo "| Work saved to | branch \`$SESSION_BRANCH\`, pushed every 2 min |"
            echo ""
            echo "The desktop link carries the password and connects on its own."
            echo "The terminal opens in the browser too, with \`opencode\` already"
            echo "installed - no SSH client needed. Touch drives the pointer; an"
            echo "OTG mouse and keyboard behave as on a desktop."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "=================================================="
          echo " Desktop: $URL"
          echo " Password: $PASS"
          echo "=================================================="

          # Hand the same details to the panel, which is where the session was
          # started and where they are actually wanted.
          GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            bash "$GITHUB_WORKSPACE/fork/tools/publish_session.sh" \
              "kind=Рабочий стол" "os=linux" \
              "url=$ACTIVE_URL" "vncUrl=$URL" "vncPass=$PASS" \
              "vncUser=(без логина)" \
              "terminal=$ACTIVE_URL/term/" \
              "sshCmd=${SSH_CMD:-}" "sshPass=${SSH_PASS:-}" \
              "branch=$SESSION_BRANCH"

      - name: Set up the desktop and RDP
        if: inputs.mode == 'rdp' || inputs.mode == 'both'
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          if [ -z "$NGROK_TOKEN" ]; then
            echo "::error::NGROK_AUTH_TOKEN is not set, so RDP cannot be reached."
            echo "Add it under Settings -> Secrets and variables -> Actions."
            echo "Get a free token at https://dashboard.ngrok.com/get-started/your-authtoken"
            echo "Or re-run this workflow with mode: ssh, which needs no token."
            exit 1
          fi

          sudo apt-get install -y xrdp xfce4 xfce4-terminal xfce4-goodies \
                                  dbus-x11 thunar mousepad firefox >/dev/null

          # xrdp defaults to a session type this image does not provide; point
          # it at XFCE explicitly or the connection opens onto a blank screen.
          echo "xfce4-session" > "$HOME/.xsession"
          sudo sed -i 's/^test -x .*/# &/' /etc/xrdp/startwm.sh 2>/dev/null || true
          echo "startxfce4" | sudo tee -a /etc/xrdp/startwm.sh >/dev/null

          PASS="eden-$(openssl rand -hex 4)"
          echo "runner:$PASS" | sudo chpasswd
          sudo systemctl enable --now xrdp
          sudo systemctl restart xrdp
          sleep 5

          curl -sL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz \
            | sudo tar xz -C /usr/local/bin
          ngrok config add-authtoken "$NGROK_TOKEN"
          nohup ngrok tcp 3389 --log stdout > /tmp/ngrok.log 2>&1 &

          for i in $(seq 1 30); do
            URL=$(curl -s http://127.0.0.1:4040/api/tunnels 2>/dev/null \
                  | python3 -c "import sys,json;t=json.load(sys.stdin).get('tunnels',[]);print(t[0]['public_url'] if t else '')" 2>/dev/null)
            [ -n "$URL" ] && break
            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "::error::ngrok did not open a tunnel. Log follows."
            cat /tmp/ngrok.log
            exit 1
          fi

          HOSTPORT=${URL#tcp://}
          {
            echo ""
            echo "## RDP"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Address | \`$HOSTPORT\` |"
            echo "| User | \`runner\` |"
            echo "| Password | \`$PASS\` |"
            echo ""
            echo "Microsoft Remote Desktop on Android: add a PC, paste the address,"
            echo "then those credentials. Touch acts as a mouse; an OTG mouse and"
            echo "keyboard work as they would on a desktop."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "=============================================="
          echo " RDP  $HOSTPORT"
          echo " user runner"
          echo " pass $PASS"
          echo "=============================================="

          GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            bash "$GITHUB_WORKSPACE/fork/tools/publish_session.sh" \
              "kind=RDP" "os=linux" \
              "rdpHost=$HOSTPORT" "rdpUser=runner" "rdpPass=$PASS" \
              "branch=$SESSION_BRANCH"

      - name: Open the SSH session
        if: inputs.mode == 'ssh' || inputs.mode == 'both'
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: false
          # Detached in every mode now. Attached, tmate blocks this step for
          # the life of the session, so the publish step below never ran and
          # the panel showed "no active session" for a session that was very
          # much alive - which is exactly what happened to run #14.
          detached: true

      - name: Publish the SSH details
        if: inputs.mode == 'ssh' || inputs.mode == 'both'
        run: |
          # tmate writes its addresses to a file; read them rather than scrape
          # the log, which is not available while the job runs.
          SSH_LINE=""; WEB_LINE=""
          for i in $(seq 1 20); do
            SSH_LINE=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}' 2>/dev/null || true)
            WEB_LINE=$(tmate -S /tmp/tmate.sock display -p '#{tmate_web}' 2>/dev/null || true)
            [ -n "$SSH_LINE" ] && break
            sleep 3
          done
          echo "ssh: ${SSH_LINE:-(none)}"
          echo "web: ${WEB_LINE:-(none)}"

          GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            bash "$GITHUB_WORKSPACE/fork/tools/publish_session.sh" \
              "kind=SSH" "os=linux" \
              "sshCmd=${SSH_LINE:-}" "terminal=${WEB_LINE:-}" \
              "branch=$SESSION_BRANCH"

      - name: Hold the session open
        if: inputs.mode != ''
        run: |
          # Without this the job would end the moment the RDP step returned,
          # taking the desktop with it.
          echo "RDP is up. This job stays alive until you cancel it, or for six"
          echo "hours - whichever comes first."
          sleep 21000

      - name: Clear the published session
        if: always()
        run: |
          GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            bash "$GITHUB_WORKSPACE/fork/tools/publish_session.sh" "state=ended" || true

      - name: Save work before the runner is destroyed
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE/fork" || exit 0
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -q -m "final autosave $(date -u '+%Y-%m-%d %H:%M')" || true
            git push -q origin HEAD || true
            echo "Pushed the last changes to ${SESSION_BRANCH:-the session branch}."
          else
            echo "Nothing left to save."
          fi

  # ── Windows ────────────────────────────────────────────────────────
  #
  #  A Windows runner is not the Linux job with different package names, so it
  #  gets its own job rather than a pile of `if` branches:
  #
  #    * RDP is a built-in service. There is no xrdp to install and no desktop
  #      to add - the session already has one.
  #    * There is no noVNC path. Windows RDP over a browser would need a
  #      gateway we cannot install in six hours of runner time, so this job is
  #      RDP-only and says so instead of pretending `mode` applies.
  #    * ngrok must tunnel TCP, and free ngrok gives a random host:port for
  #      that - the static domain is HTTP-only.
  #
  #  The Windows runner has 4 cores and 16 GB, so it is the better machine for
  #  anything interactive; it just cannot build the Android APK.

  remote-windows:
    if: inputs.os == 'windows'
    runs-on: windows-latest
    timeout-minutes: 360

    # ── Windows, no account anywhere ───────────────────────────────────
    #
    # WHAT WAS TRIED AND DROPPED
    #   RDP: never worked. FreeRDP got through TLS, licensing and channel
    #   setup and was then refused with LOGON_FAILED_UPDATE_PASSWORD - Windows
    #   demanding a password change, which RDP cannot present. The account was
    #   created four different ways and the machine policy cleared; every flag
    #   read back correct and the client was still refused.
    #
    #   Zoho Assist: needs an account and a deployment key.
    #
    #   RustDesk: its public server has required a login since April 2026 -
    #   "Due to ongoing scamming and botnet abuse, this public server currently
    #   requires users to log in before connecting". Self-hosting means running
    #   a server somewhere, which is another account somewhere else.
    #
    # WHAT THIS USES INSTEAD
    #   The desk we already built and measured: a GDI screen grab streamed as
    #   MJPEG over HTTP, with mouse and keyboard fed back through SendInput,
    #   published on a cloudflared quick tunnel. No account, no key, no
    #   registration, no password - a browser is the client.
    #
    #   Measured on this exact image rather than assumed:
    #     GDI CopyFromScreen        26508 distinct colours  (the real desktop)
    #     TightVNC as a service         1 distinct colour   (black)
    #     TightVNC as an application    1 distinct colour   (black)
    #   which is why it is GDI and not VNC.
    #
    #   Everything below is the same code as the Desks workflow, which has
    #   been run end to end: the picture came through at 29330 colours and a
    #   Meta keypress opened the Start menu, changing 429015 pixels.

    steps:
      - uses: actions/checkout@v4
        with:
          path: fork

      - name: Name this session
        shell: pwsh
        run: |
          "### Windows session: ${{ inputs.label }} (браузер, без регистрации)" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Start the desk
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --quiet --disable-pip-version-check pillow

          $script = "$env:GITHUB_WORKSPACE\fork\tools\win_desk_server.py"
          if (-not (Test-Path $script)) { throw "desk server missing at $script" }

          # A scheduled task in the console session. Two reasons, both proven
          # on live runners: a process started with Start-Process dies when its
          # step ends, and cmd /c start keeps the step waiting on a server that
          # never returns. The task must run as the logged-in user - the
          # desktop worth showing belongs to runneradmin in session 2, and a
          # SYSTEM task would capture the empty session 0.
          $me = "$env:USERDOMAIN\$env:USERNAME"
          $py = (Get-Command python).Source
          schtasks /Create /TN "symbiosis-desk" /TR "`"$py`" `"$script`" 6080" `
            /SC ONCE /ST 00:00 /RU $me /IT /F | Out-Null
          schtasks /Run /TN "symbiosis-desk" | Out-Null

          $ok = $false
          foreach ($try in 1..30) {
            Start-Sleep -Seconds 2
            if ((curl.exe -s -o NUL -w "%{http_code}" -m 10 "http://127.0.0.1:6080/health") -eq "200") {
              $ok = $true; break
            }
          }
          if (-not $ok) { throw "the desk server did not come up on 6080" }
          Write-Host "desk server is up"

      - name: Confirm the picture is a real desktop, not a black rectangle
        shell: pwsh
        run: |
          # The whole reason VNC was abandoned here. A frame that decodes and
          # has one distinct colour is a black screen dressed as a success, so
          # the desk refuses to be published unless the picture is real.
          curl.exe -s -o "$env:TEMP\frame.jpg" -m 30 "http://127.0.0.1:6080/shot"
          $check = @(
            'from PIL import Image',
            'import sys',
            'im = Image.open(sys.argv[1]).convert("RGB")',
            'c = im.getcolors(maxcolors=500000)',
            'n = len(c) if c else 500000',
            'print("frame", im.size, "distinct colours:", n)',
            'sys.exit(0 if n > 2 else 1)'
          ) -join "`n"
          $check | Out-File -FilePath "$env:TEMP\check.py" -Encoding utf8
          python "$env:TEMP\check.py" "$env:TEMP\frame.jpg"
          if ($LASTEXITCODE -ne 0) { throw "the desk is showing a black screen" }
          Write-Host "the picture is a real desktop"

      - name: Open the tunnel
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cf = "$env:TEMP\cloudflared.exe"
          # curl.exe, not Invoke-WebRequest: the .NET stack on this image fails
          # GitHub's redirect with RemoteCertificateNameMismatch.
          curl.exe -sL --retry 3 -o $cf `
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
          if (-not (Test-Path $cf)) { throw "could not download cloudflared" }

          $log = "$env:TEMP\cf.log"
          cmd /c start "" /b "$cf" tunnel --url http://localhost:6080 --no-autoupdate --loglevel info `
            "1>$log" "2>$env:TEMP\cf.err"

          $url = $null
          foreach ($try in 1..40) {
            Start-Sleep -Seconds 2
            $text = (Get-Content $log, "$env:TEMP\cf.err" -Raw -ErrorAction SilentlyContinue) -join "`n"
            if ($text -match "https://[a-z0-9-]+\.trycloudflare\.com") { $url = $Matches[0]; break }
          }
          if (-not $url) {
            Get-Content $log, "$env:TEMP\cf.err" -Tail 30 -ErrorAction SilentlyContinue | Write-Host
            throw "cloudflared did not report an address"
          }

          # The hostname resolves before the edge will serve it; a client that
          # opens it too early sees 502 and blames the desk.
          foreach ($try in 1..20) {
            if ((curl.exe -s -o NUL -w "%{http_code}" -m 15 "$url/health") -eq "200") { break }
            Start-Sleep -Seconds 3
          }
          "DESK_URL=$url" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "desk: $url"

      - name: Publish the address
        shell: pwsh
        run: |
          @(
            "## Windows session",
            "",
            "**[Открыть]($env:DESK_URL/)** - без пароля и без регистрации.",
            "",
            "Это собственный рабочий стол раннера. Управление пальцем: тап -",
            "клик, нажать и вести - перетаскивание, долгое нажатие - правая",
            "кнопка, два пальца - прокрутка. Есть экранная клавиатура.",
            "",
            "Машина уничтожается вместе с этим прогоном, максимум через шесть часов."
          ) -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

          $env:GH_TOKEN = "${{ secrets.GITHUB_TOKEN }}"
          bash "$env:GITHUB_WORKSPACE/fork/tools/publish_session.sh" `
            "slot=windows" "kind=Стол Windows" "os=windows" `
            "url=$env:DESK_URL" "deskUrl=$env:DESK_URL/" `
            "auth=без пароля и регистрации" `
            "label=${{ inputs.label }}"

      - name: Hold the session open
        shell: pwsh
        run: |
          Write-Host "The desk stays up until you cancel this run, or for six hours."
          $cf = "$env:TEMP\cloudflared.exe"

          for ($i = 0; $i -lt 1400; $i++) {
            Start-Sleep -Seconds 15

            # Watch what a visitor sees, not a process id. A dead server behind
            # a live tunnel answers 502, and no pid check would notice - that
            # is exactly how the agent came to show "Host Error".
            $local = (curl.exe -s -o NUL -w "%{http_code}" -m 10 "http://127.0.0.1:6080/health")
            if ($local -ne "200") {
              Write-Host "::warning::the desk server stopped answering ($local); restarting it."
              schtasks /Run /TN "symbiosis-desk" | Out-Null
              Start-Sleep -Seconds 8
            }

            if (Get-Process cloudflared -ErrorAction SilentlyContinue) { continue }

            Write-Host "::warning::the tunnel exited; restarting it."
            $log = "$env:TEMP\cf2.log"
            cmd /c start "" /b "$cf" tunnel --url http://localhost:6080 --no-autoupdate --loglevel info `
              "1>$log" "2>$env:TEMP\cf2.err"
            $url = $null
            foreach ($try in 1..30) {
              Start-Sleep -Seconds 2
              $text = (Get-Content $log, "$env:TEMP\cf2.err" -Raw -ErrorAction SilentlyContinue) -join "`n"
              if ($text -match "https://[a-z0-9-]+\.trycloudflare\.com") { $url = $Matches[0]; break }
            }
            if ($url) {
              Write-Host "back up on $url"
              $env:GH_TOKEN = "${{ secrets.GITHUB_TOKEN }}"
              bash "$env:GITHUB_WORKSPACE/fork/tools/publish_session.sh" `
                "slot=windows" "kind=Стол Windows" "os=windows" `
                "url=$url" "deskUrl=$url/" `
                "auth=без пароля и регистрации" "label=${{ inputs.label }}"
            }
          }

      - name: Clear the published session
        if: always()
        shell: pwsh
        run: |
          $env:GH_TOKEN = "${{ secrets.GITHUB_TOKEN }}"
          bash "$env:GITHUB_WORKSPACE/fork/tools/publish_session.sh" `
            "slot=windows" "state=ended"
