name: Android 15 ARM Emulator backend diagnostic (no release)
on:
  workflow_call:
permissions:
  contents: read
jobs:
  page16k-kernel:
    # Separate kernel-only experiment; not an Android userspace or APK test.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install software QEMU and ARM64 static compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-arm gcc-aarch64-linux-gnu libc6-dev-arm64-cross cpio
      - name: Verify real 16K page size and ISA on the official Android kernel
        run: |
          set -o pipefail
          bash tests/modern_android_qemu/probe_16k_kernel.sh | tee /tmp/real-16k-kernel.txt
      - name: Save kernel-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android15-16k-kernel-only-log
          path: /tmp/real-16k-kernel.txt
          if-no-files-found: warn
          retention-days: 3

  software-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      PROBE_WORK: /tmp/sym-android35
      KOTLINC_HOME: /tmp/kotlinc
      ANDROID_AVD_HOME: /tmp/android35-avd
      ANDROID_SERIAL: emulator-5560
      PROBE_WAIT_SECONDS: '180'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install diagnostic build tools and pinned Android Emulator
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpulse0 e2fsprogs
          sdkmanager --install 'ndk;28.2.13676358' 'platforms;android-35' 'build-tools;35.0.0'
          curl -fsSL --retry 3 -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q /tmp/kotlin.zip -d /tmp && rm /tmp/kotlin.zip
          curl -fsSL --retry 3 -o /tmp/emulator.zip https://dl.google.com/android/repository/emulator-linux_x64-12038310.zip
          echo '621c9384efa919ecf42d94b29e47abbc097261fa7bff667adf4bddb9a35f7254  /tmp/emulator.zip' | sha256sum -c -
          unzip -q /tmp/emulator.zip -d /tmp/android-emulator-pinned && rm /tmp/emulator.zip
      - name: Install pinned official ARM64 Android 15 system image
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/system-images/android-35/google_apis" "$PROBE_WORK"
          curl -fsSL --retry 3 -o /tmp/android35-image.zip https://dl.google.com/android/repository/sys-img/google_apis/arm64-v8a-35_r09.zip
          echo 'd2e7c6076e5df54d3677605a324daf9edf813b2808c216bdb1687f6b2b6aed99  /tmp/android35-image.zip' | sha256sum -c -
          unzip -q /tmp/android35-image.zip -d "$ANDROID_HOME/system-images/android-35/google_apis"
          rm /tmp/android35-image.zip
      - name: Build disposable diagnostic APK and standalone probes
        run: bash tests/android_core_probe/build.sh
      - name: Boot real Android Emulator backend, then run real-core probes
        run: bash tests/modern_android_qemu/emulator_backend.sh
      - name: Save diagnostics only (never test APKs or core binaries)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android35-arm-emulator-backend-logs
          path: |
            /tmp/sym-android35/emulator.log
            /tmp/sym-android35/boot-status.txt
            /tmp/sym-android35/cpuinfo.txt
            /tmp/sym-android35/standalone-*.txt
            /tmp/sym-android35/*-logcat.txt
            /tmp/sym-android35/*-probe-crash.txt
            /tmp/sym-android35/*-kenji-stdout.txt
            /tmp/sym-android35/*-kenji-jni.txt
          if-no-files-found: warn
          retention-days: 3
