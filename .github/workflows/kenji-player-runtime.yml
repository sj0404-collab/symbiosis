name: Real-player ARM Android diagnostic (never release)
on:
  workflow_call:
    inputs:
      tls_candidate:
        type: boolean
        default: false
      bundled_tls_probe:
        type: boolean
        default: false
      core_update:
        type: boolean
        default: false
      core_update_sha:
        type: string
        default: '969431b3962408dd02ce38bd2cd4b2a954d11e5212ddef3f65c80a0b419918b8'
      compare_space:
        type: boolean
        default: false
      guest_tls:
        type: boolean
        default: false
      guest_tls_auto_bind:
        type: boolean
        default: false
      ssl_count:
        type: boolean
        default: false
      reference_ssl_count_patch:
        type: boolean
        default: false
      tls_parallel:
        type: boolean
        default: false
      guest_network:
        type: boolean
        default: false
      guest_account:
        type: boolean
        default: false
      hid_long:
        type: boolean
        default: false
      reference_core:
        type: boolean
        default: false
      reference_tls_patch:
        type: boolean
        default: false
      reference_network_patch:
        type: boolean
        default: false
      reference_missing_interface:
        type: boolean
        default: false
      reference_zero_interface:
        type: boolean
        default: false
      reference_valid_interface:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PLAY_WORK: /tmp/player-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          path: fork
          persist-credentials: false
      - name: Check out exact Eden source
        run: |
          git clone --depth 50 --single-branch --branch v0.2.1 https://git.eden-emu.dev/eden-emu/eden.git eden
          test "$(git -C eden rev-parse HEAD)" = 58c1e20ee58efa3900ba616207d460886214480b
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install real native build dependencies
        run: |
          sdkmanager --install 'ndk;28.2.13676358' 'cmake;3.31.6' 'build-tools;35.0.0' 'platforms;android-36'
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools ccache
      - name: Reject replacement during bundled TLS verification
        if: inputs.tls_candidate && inputs.bundled_tls_probe
        run: |
          echo 'BUNDLED_TLS_PROBE_MUST_NOT_REPLACE_LIBRARIES'
          exit 1
      - name: Restrict published core update probe to pinned core
        if: inputs.core_update && (inputs.compare_space || inputs.reference_core)
        run: |
          echo 'CORE_UPDATE_PROBE_REQUIRES_PINNED_PRIMARY_CORE'
          exit 1
      - name: Reject incompatible research options
        if: (inputs.reference_tls_patch || inputs.reference_network_patch) && !inputs.reference_core
        run: |
          echo 'RESEARCH_PATCH_REQUIRES_REFERENCE_CORE'
          exit 1
      - name: Restrict invalid-interface fixture to its diagnostic
        if: (inputs.reference_missing_interface || inputs.reference_zero_interface || inputs.reference_valid_interface) && (!inputs.reference_core || !inputs.reference_network_patch || !inputs.guest_network || (inputs.reference_missing_interface && (inputs.reference_zero_interface || inputs.reference_valid_interface)) || (inputs.reference_zero_interface && inputs.reference_valid_interface))
        run: |
          echo 'MISSING_INTERFACE_FIXTURE_REQUIRES_SOURCE_PATCH_AND_NETWORK_PROBE'
          exit 1
      - name: Require guest TLS probe for automatic-bind fixture
        if: inputs.guest_tls_auto_bind && (!inputs.guest_tls || !inputs.reference_core || !inputs.reference_tls_patch)
        run: |
          echo 'AUTO_TLS_FIXTURE_REQUIRES_INSTRUMENTED_SOURCE_TLS_PROBE'
          exit 1
      - name: Restrict SSL connection count candidate to research probe
        if: (inputs.ssl_count || inputs.reference_ssl_count_patch) && (!inputs.reference_core || !inputs.reference_tls_patch || !inputs.guest_tls || (inputs.reference_ssl_count_patch && !inputs.ssl_count))
        run: |
          echo 'SSL_COUNT_REQUIRES_SOURCE_TLS_AND_COUNT_PROBE'
          exit 1
      - name: Restrict parallel TLS to research source and fixtures
        if: inputs.tls_parallel && (!inputs.guest_tls || !inputs.reference_core || !inputs.reference_tls_patch || !inputs.reference_network_patch || inputs.compare_space)
        run: |
          echo 'PARALLEL_TLS_REQUIRES_RESEARCH_PATCHES_AND_TLS_FIXTURE'
          exit 1
      - uses: actions/setup-dotnet@v4
        if: inputs.reference_core
        with:
          dotnet-version: '9.0.x'
      - name: Build pinned-source research core (not a release)
        if: inputs.reference_core
        run: |
          set -euo pipefail
          # Combining two alternate debug pins would obscure which core ran.
          [ "${{ inputs.compare_space }}" = false ] || { echo 'REFERENCE_AND_SPACE_COMPARISON_UNSUPPORTED'; exit 1; }
          git init /tmp/reference-kenji
          git -C /tmp/reference-kenji remote add origin https://git.ryujinx.app/projects/Kenji-NX.git
          git -C /tmp/reference-kenji fetch --depth=1 origin 280c427c550c5fe3bcc46b378e06a9b90a7e6b09
          git -C /tmp/reference-kenji checkout --detach FETCH_HEAD
          test "$(git -C /tmp/reference-kenji rev-parse HEAD)" = 280c427c550c5fe3bcc46b378e06a9b90a7e6b09
          if [ "${{ inputs.reference_tls_patch }}" = true ]; then
            git -C /tmp/reference-kenji apply --check "$GITHUB_WORKSPACE/fork/tests/source_core_probe/ssl-research.patch"
            git -C /tmp/reference-kenji apply "$GITHUB_WORKSPACE/fork/tests/source_core_probe/ssl-research.patch"
            sha256sum "$GITHUB_WORKSPACE/fork/tests/source_core_probe/ssl-research.patch"
            echo 'EXPERIMENTAL_SSL_PATCH_APPLIED_NOT_RELEASE'
          fi
          if [ "${{ inputs.reference_ssl_count_patch }}" = true ]; then
            git -C /tmp/reference-kenji apply --check "$GITHUB_WORKSPACE/fork/tests/source_core_probe/ssl-connection-count-research.patch"
            git -C /tmp/reference-kenji apply "$GITHUB_WORKSPACE/fork/tests/source_core_probe/ssl-connection-count-research.patch"
            sha256sum "$GITHUB_WORKSPACE/fork/tests/source_core_probe/ssl-connection-count-research.patch"
            echo 'EXPERIMENTAL_SSL_COUNT_PATCH_APPLIED_NOT_RELEASE'
          fi
          if [ "${{ inputs.tls_parallel }}" = true ]; then
            python3 "$GITHUB_WORKSPACE/fork/tests/player_runtime_probe/instrument_tls_parallel_store.py" /tmp/reference-kenji/src/Ryujinx.HLE/HOS/Services/Ssl/SslService/ServerTrustStore.cs
            echo 'TLS_PARALLEL_STORE_INSTRUMENTATION_NOT_RELEASE'
          fi
          if [ "${{ inputs.reference_network_patch }}" = true ]; then
            git -C /tmp/reference-kenji apply --check "$GITHUB_WORKSPACE/fork/tests/source_core_probe/network-research.patch"
            git -C /tmp/reference-kenji apply "$GITHUB_WORKSPACE/fork/tests/source_core_probe/network-research.patch"
            sha256sum "$GITHUB_WORKSPACE/fork/tests/source_core_probe/network-research.patch"
            echo 'EXPERIMENTAL_NETWORK_PATCH_APPLIED_NOT_RELEASE'
          fi
          if [ "${{ inputs.reference_missing_interface }}" = true ]; then
            git -C /tmp/reference-kenji apply --check "$GITHUB_WORKSPACE/fork/tests/source_core_probe/network-missing-interface-fixture.patch"
            git -C /tmp/reference-kenji apply "$GITHUB_WORKSPACE/fork/tests/source_core_probe/network-missing-interface-fixture.patch"
            sha256sum "$GITHUB_WORKSPACE/fork/tests/source_core_probe/network-missing-interface-fixture.patch"
            echo 'INVALID_INTERFACE_FIXTURE_APPLIED_NOT_RELEASE'
          fi
          if [ "${{ inputs.reference_zero_interface }}" = true ]; then
            git -C /tmp/reference-kenji apply --check "$GITHUB_WORKSPACE/fork/tests/source_core_probe/network-zero-interface-fixture.patch"
            git -C /tmp/reference-kenji apply "$GITHUB_WORKSPACE/fork/tests/source_core_probe/network-zero-interface-fixture.patch"
            echo 'ZERO_INTERFACE_FIXTURE_APPLIED_NOT_RELEASE'
          fi
          if [ "${{ inputs.reference_valid_interface }}" = true ]; then
            git -C /tmp/reference-kenji apply --check "$GITHUB_WORKSPACE/fork/tests/source_core_probe/network-valid-loopback-fixture.patch"
            git -C /tmp/reference-kenji apply "$GITHUB_WORKSPACE/fork/tests/source_core_probe/network-valid-loopback-fixture.patch"
            python3 - <<'PYFIXTURE'
          from pathlib import Path
          p = Path('/tmp/reference-kenji/src/Ryujinx.HLE/HOS/Services/Sockets/Bsd/Proxy/DefaultSocket.cs')
          s = p.read_text()
          needle = '                BaseSocket.Bind(new IPEndPoint(selectedAddress, 0));'
          assert s.count(needle) == 1
          s = s.replace(needle, needle + '\n                Ryujinx.Common.Logging.Logger.Info?.Print(Ryujinx.Common.Logging.LogClass.Application, $"CI_EXACT_INTERFACE_BOUND address={selectedAddress} id={_lanInterfaceId}");')
          p.write_text(s)
          PYFIXTURE
            echo 'VALID_INTERFACE_FIXTURE_APPLIED_NOT_RELEASE'
          fi
          mkdir -p "$PLAY_WORK/source-output"
          export PATH="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cd /tmp/reference-kenji
          dotnet publish src/LibKenjinx/LibKenjinx.csproj -r linux-bionic-arm64 -c Release \
            -p:DisableUnsupportedError=true -p:PublishAotUsingRuntimePack=true \
            -p:CppCompilerAndLinker="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
            -p:StripSymbols=false -p:DefineConstants=ANDROID -o "$PLAY_WORK/source-output"
          test -f "$PLAY_WORK/source-output/LibKenjinx.so"
          cp "$PLAY_WORK/source-output/LibKenjinx.so" "$PLAY_WORK/core-source.so"
          sha256sum "$PLAY_WORK/core-source.so" | cut -d' ' -f1 | tee "$PLAY_WORK/source-core-sha256.txt"
          rm -rf /tmp/reference-kenji "$PLAY_WORK/source-output"
          echo 'SOURCE_CORE_FOR_DIAGNOSTIC_ONLY'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: player-diag-gradle-${{ runner.os }}-${{ hashFiles('fork/patch/**') }}
          restore-keys: |
            gradle-${{ runner.os }}-
            player-diag-gradle-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-symbiosis-v0.2.1-debug-${{ hashFiles('fork/patch/upstream_changes.patch', 'fork/patch/native_symbiosis.cpp') }}
          restore-keys: ccache-symbiosis-v0.2.1-debug-
      - name: Build production OpenAL source for Android ARM64
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          git clone --depth 1 https://git.ryujinx.app/kenji-nx/openal-soft.git /tmp/openal-soft
          git -C /tmp/openal-soft rev-parse HEAD
          cmake -S /tmp/openal-soft -B /tmp/openal-build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=Release \
            -DLIBTYPE=SHARED -DALSOFT_EXAMPLES=OFF -DALSOFT_UTILS=OFF -DALSOFT_TESTS=OFF -DALSOFT_INSTALL=OFF
          cmake --build /tmp/openal-build -j4 --target OpenAL
          SO="$(find /tmp/openal-build -name 'libopenal.so*' -type f | head -1)"
          test -n "$SO"
          cp "$SO" fork/patch/libs/arm64-v8a/libopenal.so
          sha256sum "$SO"
      - name: Build 16K-aligned Kenji FFmpeg from pinned source
        run: |
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" \
            bash fork/tools/build_kenji_ffmpeg.sh "$GITHUB_WORKSPACE/fork/patch/libs/arm64-v8a"
      - name: Build supported TLS candidate for disposable player only
        if: inputs.tls_candidate
        run: |
          set -euo pipefail
          mkdir -p "$PLAY_WORK"
          STANDALONE_WORK="$PLAY_WORK" bash fork/tests/standalone_core_probe/build_tls_candidate.sh
          cp "$PLAY_WORK/tls-candidate/libcrypto.so" "$PLAY_WORK/tls-candidate/libssl.so" fork/patch/libs/arm64-v8a/
          echo 'TEST_ONLY_OPENSSL_CANDIDATE_IN_DEBUG_TREE'
      - name: Apply real production sources and add CI-only launcher
        run: |
          set -euo pipefail
          bash fork/tools/apply_patch.sh --patch "$GITHUB_WORKSPACE/fork/patch" --eden "$GITHUB_WORKSPACE/eden"
          # Observe real graphics callback calls in the disposable debug tree only.
          python3 fork/tests/player_runtime_probe/instrument_graphics.py eden/src/android/app/src/main/jni/symbiosis_kenji_bridge.cpp
          python3 fork/tests/player_runtime_probe/instrument_ffmpeg.py eden/src/android/app/src/main/jni/symbiosis_kenji_bridge.cpp
          if [ "${{ inputs.tls_candidate }}" = true ] || [ "${{ inputs.bundled_tls_probe }}" = true ]; then
            python3 fork/tests/player_runtime_probe/instrument_tls.py eden/src/android/app/src/main/jni/symbiosis_kenji_bridge.cpp
          fi
          python3 fork/tests/player_runtime_probe/instrument_stop_race.py eden/src/android/app/src/main/java/org/yuzu/yuzu_emu/activities/KenjiPlayerActivity.kt
          if [ "${{ inputs.compare_space }}" = true ]; then
            python3 fork/tests/player_runtime_probe/instrument_core_space.py eden/src/android/app/src/main/java/org/yuzu/yuzu_emu/utils/EngineLoader.kt
          fi
          if [ "${{ inputs.reference_core }}" = true ]; then
            python3 fork/tests/player_runtime_probe/instrument_core_source.py eden/src/android/app/src/main/java/org/yuzu/yuzu_emu/utils/EngineLoader.kt "$(cat "$PLAY_WORK/source-core-sha256.txt")"
          fi
          python3 fork/tests/player_runtime_probe/instrument_overlay.py eden/src/android/app/src/main/java/org/yuzu/yuzu_emu/overlay/InputOverlay.kt
          python3 fork/tests/player_runtime_probe/instrument_shader_config.py eden/src/android/app/src/main/java/org/yuzu/yuzu_emu/utils/KenjiBridge.kt
          test ! -e eden/src/android/app/src/debug/AndroidManifest.xml
          mkdir -p eden/src/android/app/src/debug/java/dev/symbiosis/playerruntime
          cp fork/tests/player_runtime_probe/AndroidManifest.xml eden/src/android/app/src/debug/AndroidManifest.xml
          cp fork/tests/player_runtime_probe/DiagnosticLauncher.kt fork/tests/player_runtime_probe/LockProbeReceiver.kt eden/src/android/app/src/debug/java/dev/symbiosis/playerruntime/
      - name: Build in-process TLS test library in disposable tree
        if: inputs.tls_candidate || inputs.bundled_tls_probe
        run: |
          set -euo pipefail
          CXX="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++"
          "$CXX" -std=c++17 -O2 -fPIC -shared -static-libstdc++ -DTLS_HANDSHAKE_NO_MAIN \
            -Wl,-z,max-page-size=16384 -Wl,-soname,libtls_in_process_probe.so \
            fork/tests/standalone_core_probe/tls_handshake.cpp fork/tests/player_runtime_probe/tls_in_process.cpp \
            -ldl -llog -o eden/src/android/app/src/main/jniLibs/arm64-v8a/libtls_in_process_probe.so
      - name: Build CI-only in-process FFmpeg decode probe
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg xxd
          ffmpeg -v error -f lavfi -i 'color=c=blue:s=16x16:r=1' -frames:v 1 \
            -c:v libx264 -preset ultrafast -tune zerolatency -f h264 /tmp/ci_h264.h264
          xxd -i -n ci_h264 /tmp/ci_h264.h264 > /tmp/ci_h264.h
          TC="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          FFMPEG=/tmp/symbiosis-kenji-ffmpeg/ffmpeg-5.1.8
          LIBS="$GITHUB_WORKSPACE/fork/patch/libs/arm64-v8a"
          "$TC/aarch64-linux-android26-clang" -std=c11 -O2 -fPIC -shared \
            -I"$FFMPEG" -I/tmp fork/tests/player_runtime_probe/ffmpeg_in_process.c \
            -L"$LIBS" -lavcodec -lavutil -lswresample -ldl -llog \
            -Wl,-z,max-page-size=16384 -Wl,-soname,libffmpeg_ci_probe.so \
            -o eden/src/android/app/src/main/jniLibs/arm64-v8a/libffmpeg_ci_probe.so
      - name: Build disposable debug application, not a release
        working-directory: eden/src/android
        run: |
          export CCACHE_DIR="$HOME/.cache/ccache"
          ccache --set-config=max_size=3G
          ccache --set-config=base_dir="$GITHUB_WORKSPACE"
          ccache --set-config=hash_dir=false
          ccache --set-config=compiler_check=content
          ./gradlew assembleLegacyDebug -PYUZU_ANDROID_ARGS='-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache' --parallel --max-workers=4
      - name: Audit FFmpeg and license in disposable APK
        run: |
          python3 fork/tests/player_runtime_probe/audit_ffmpeg_apk.py "$PLAY_WORK/player-debug.apk"
      - name: Prepare pinned core and self-authored NRO
        working-directory: fork
        run: |
          set -euo pipefail
          mkdir -p "$PLAY_WORK"
          mapfile -t APK < <(find "$GITHUB_WORKSPACE/eden/src/android/app/build/outputs/apk/legacy/debug" -name '*.apk')
          [ "${#APK[@]}" = 1 ]
          cp "${APK[0]}" "$PLAY_WORK/player-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$PLAY_WORK/player-debug.apk" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" > "$PLAY_WORK/package.txt"
          test -s "$PLAY_WORK/package.txt"
          if [ "${{ inputs.reference_core }}" = true ]; then
            cp "$PLAY_WORK/core-source.so" "$PLAY_WORK/core_sym.so"
            echo "$(cat "$PLAY_WORK/source-core-sha256.txt")  $PLAY_WORK/core_sym.so" | sha256sum -c -
            echo 'PLAYER_PRIMARY_CORE=SOURCE_RESEARCH_NOT_PINNED_USER_BINARY'
          else
            curl -fsSL --retry 3 -o "$PLAY_WORK/core_sym.so" https://github.com/sj0404-collab/symbiosis/releases/download/engine-kenji/libkenji.so
            echo "969431b3962408dd02ce38bd2cd4b2a954d11e5212ddef3f65c80a0b419918b8  $PLAY_WORK/core_sym.so" | sha256sum -c -
          fi
          if [ "${{ inputs.compare_space }}" = true ]; then
            curl -fsSL --retry 3 -o "$PLAY_WORK/reference.apk" https://github.com/sj0404-collab/SymbEK/releases/download/v1.0.121/Kenji-Space-1.0.121.apk
            echo "f9eb3ecfaf5700df1b5d575984ab1588848c0eb6a70b2acb19b9e6243705f95e  $PLAY_WORK/reference.apk" | sha256sum -c -
            unzip -p "$PLAY_WORK/reference.apk" lib/arm64-v8a/libkenjinx.so > "$PLAY_WORK/core_space.so"
            echo "d781048671e4cef1cde2ec15db8fe29b949df9949d83569ceaf776ad12901590  $PLAY_WORK/core_space.so" | sha256sum -c -
            rm "$PLAY_WORK/reference.apk"
          fi
          bash tests/player_runtime_probe/build_nro.sh
      - name: Audit actual debug APK ELF and ZIP alignment
        if: inputs.tls_candidate || inputs.bundled_tls_probe
        working-directory: fork
        run: |
          set -euo pipefail
          python3 tests/player_runtime_probe/audit_apk_16k.py "$PLAY_WORK/player-debug.apk" | tee "$PLAY_WORK/apk-16k-audit.txt"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$PLAY_WORK/player-debug.apk" > "$PLAY_WORK/zipalign-16k.txt" 2>&1 || echo 'APK_ZIPALIGN_16K_NOT_VERIFIED (see audit)'
      - name: Verify bundled libraries and license in the actual diagnostic APK
        if: inputs.bundled_tls_probe
        working-directory: fork
        run: |
          python3 - "$PLAY_WORK/player-debug.apk" <<'PYAPK'
          import hashlib, importlib.util, sys, zipfile
          spec = importlib.util.spec_from_file_location('guard', 'tools/check_kenji_release_ready.py')
          guard = importlib.util.module_from_spec(spec); spec.loader.exec_module(guard)
          with zipfile.ZipFile(sys.argv[1]) as z:
              for name, expected in guard.EXPECTED_OPENSSL_SHA256.items():
                  actual = hashlib.sha256(z.read('lib/arm64-v8a/' + name)).hexdigest()
                  if actual != expected: raise SystemExit('APK_BUNDLED_TLS_HASH_MISMATCH ' + name)
                  print('APK_BUNDLED_TLS_HASH_OK', name, actual)
              for name in ('openssl-3.5.9-license.txt', 'openssl-3.5.9-notice.txt'):
                  data = z.read('assets/' + name)
                  if not data: raise SystemExit('APK_OPENSSL_LICENSE_MISSING ' + name)
                  print('APK_OPENSSL_LICENSE_PRESENT', name)
          PYAPK
      - uses: actions/upload-artifact@v4
        with:
          name: disposable-player-runtime-not-release
          path: |
            /tmp/player-runtime/player-debug.apk
            /tmp/player-runtime/package.txt
            /tmp/player-runtime/core_sym.so
            /tmp/player-runtime/source-core-sha256.txt
            /tmp/player-runtime/core_space.so
            /tmp/player-runtime/swkbd.nro
            /tmp/player-runtime/graphics.nro
            /tmp/player-runtime/shader.nro
            /tmp/player-runtime/guest-tls.nro
            /tmp/player-runtime/guest-network.nro
            /tmp/player-runtime/guest-account.nro
            /tmp/player-runtime/hid-long.nro
            /tmp/player-runtime/tls-parallel.nro
            /tmp/player-runtime/apk-16k-audit.txt
            /tmp/player-runtime/zipalign-16k.txt
          if-no-files-found: error
          retention-days: 1

  real-player-on-arm:
    needs: build-diagnostic
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      PLAY_WORK: /tmp/player-runtime
      ANDROID_SERIAL: 127.0.0.1:5558
      PLAYER_EXPECT_TLS_CANDIDATE: ${{ (inputs.tls_candidate || inputs.bundled_tls_probe) && '1' || '0' }}
      PLAYER_COMPARE_SPACE: ${{ inputs.compare_space && '1' || '0' }}
      PLAYER_CORE_UPDATE: ${{ inputs.core_update && '1' || '0' }}
      PLAYER_CORE_UPDATE_EXPECTED_SHA: ${{ inputs.core_update_sha }}
      PLAYER_GUEST_TLS: ${{ inputs.guest_tls && '1' || '0' }}
      PLAYER_GUEST_TLS_AUTO_BIND: ${{ inputs.guest_tls_auto_bind && '1' || '0' }}
      PLAYER_SSL_COUNT: ${{ inputs.ssl_count && '1' || '0' }}
      PLAYER_REFERENCE_SSL_COUNT_PATCH: ${{ inputs.reference_ssl_count_patch && '1' || '0' }}
      PLAYER_TLS_PARALLEL: ${{ inputs.tls_parallel && '1' || '0' }}
      PLAYER_GUEST_NETWORK: ${{ inputs.guest_network && '1' || '0' }}
      PLAYER_GUEST_ACCOUNT: ${{ inputs.guest_account && '1' || '0' }}
      PLAYER_HID_LONG: ${{ inputs.hid_long && '1' || '0' }}
      PLAYER_REFERENCE_CORE: ${{ inputs.reference_core && '1' || '0' }}
      PLAYER_REFERENCE_TLS_PATCH: ${{ inputs.reference_tls_patch && '1' || '0' }}
      PLAYER_REFERENCE_NETWORK_PATCH: ${{ inputs.reference_network_patch && '1' || '0' }}
      PLAYER_REFERENCE_MISSING_INTERFACE: ${{ inputs.reference_missing_interface && '1' || '0' }}
      PLAYER_REFERENCE_ZERO_INTERFACE: ${{ inputs.reference_zero_interface && '1' || '0' }}
      PLAYER_REFERENCE_VALID_INTERFACE: ${{ inputs.reference_valid_interface && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: disposable-player-runtime-not-release
          path: /tmp/player-runtime
      - name: Install authentic adb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends adb python3-pil openssl
      - name: Run actual player and its dialog in Android ARM
        run: bash tests/player_runtime_probe/run.sh
      - name: Preserve logs only, never diagnostic APK or core
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-player-runtime-logs
          path: |
            /tmp/player-runtime/redroid-*.txt
            /tmp/player-runtime/player-*.txt
            /tmp/player-runtime/player-ui.xml
            /tmp/player-runtime/player-frame-*.png
            /tmp/player-runtime/shader-frame-*.png
            /tmp/player-runtime/shader-*.txt
            /tmp/player-runtime/apk-16k-audit.txt
            /tmp/player-runtime/zipalign-16k.txt
            /tmp/player-runtime/guest-tls-server-*.txt
            /tmp/player-runtime/guest-network-*.txt
            /tmp/player-runtime/guest-account-*.txt
            /tmp/player-runtime/hid-long-*.txt
            /tmp/player-runtime/tls-parallel-*.txt
          if-no-files-found: warn
          retention-days: 3
