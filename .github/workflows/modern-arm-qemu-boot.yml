name: Experimental Android 15 ARM QEMU boot (no APK)
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install QEMU and filesystem tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-arm gdisk e2fsprogs unzip
      - name: Download official Android 15 ARM64 image and check pinned digest
        run: |
          set -euxo pipefail
          mkdir -p /tmp/android35/logs /tmp/android35/image
          curl -fL --retry 3 --connect-timeout 30 --max-time 1000 \
            https://dl.google.com/android/repository/sys-img/google_apis/arm64-v8a-35_r09.zip \
            -o /tmp/android35/image.zip
          echo '16f5bceca236b2737008977c4aaf826e46a8de7d  /tmp/android35/image.zip' | sha1sum -c -
          sha256sum /tmp/android35/image.zip | tee /tmp/android35/logs/image-sha256.txt
          unzip -q /tmp/android35/image.zip 'arm64-v8a/kernel-ranchu' 'arm64-v8a/ramdisk.img' \
            'arm64-v8a/system.img' 'arm64-v8a/vendor.img' 'arm64-v8a/encryptionkey.img' -d /tmp/android35/image
          rm /tmp/android35/image.zip
          gzip -dc /tmp/android35/image/arm64-v8a/kernel-ranchu > /tmp/android35/kernel.raw
          df -h /tmp | tee /tmp/android35/logs/disk.txt
      - name: Boot actual Android image and report ADB readiness
        run: bash tests/modern_android_qemu/boot.sh /tmp/android35
      - name: Save only boot diagnostics (no APK or system image)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-arm-qemu-boot-logs
          path: /tmp/android35/logs/*.txt
          if-no-files-found: warn
          retention-days: 3
