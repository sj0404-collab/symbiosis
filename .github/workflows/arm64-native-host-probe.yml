name: Native ARM64 Linux core loader experiment (not Android)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  native-arm64-linux:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned core files and native loader probe
        run: |
          set -euo pipefail
          mkdir -p /tmp/native-arm-probe
          curl -fsSL --retry 3 -o /tmp/native-arm-probe/sym.so https://github.com/sj0404-collab/symbiosis/releases/download/engine-kenji/libkenji.so
          curl -fsSL --retry 3 -o /tmp/native-arm-probe/symbek.apk https://github.com/sj0404-collab/SymbEK/releases/download/v1.0.121/Kenji-Space-1.0.121.apk
          echo '969431b3962408dd02ce38bd2cd4b2a954d11e5212ddef3f65c80a0b419918b8  /tmp/native-arm-probe/sym.so' | sha256sum -c -
          echo 'f9eb3ecfaf5700df1b5d575984ab1588848c0eb6a70b2acb19b9e6243705f95e  /tmp/native-arm-probe/symbek.apk' | sha256sum -c -
          unzip -p /tmp/native-arm-probe/symbek.apk lib/arm64-v8a/libkenjinx.so > /tmp/native-arm-probe/space.so
          echo 'd781048671e4cef1cde2ec15db8fe29b949df9949d83569ceaf776ad12901590  /tmp/native-arm-probe/space.so' | sha256sum -c -
          rm /tmp/native-arm-probe/symbek.apk
          g++ -std=c++17 -O2 -Wall -Wextra -Werror tests/standalone_core_probe/probe.cpp -ldl -o /tmp/native-arm-probe/probe
      - name: Record actual CPU and attempt Linux dlopen, no JNI
        run: |
          set -euo pipefail
          cd /tmp/native-arm-probe
          {
            echo 'Native Linux ARM64 runner. Not Android, not a game, no JNI.'
            uname -a
            for core in sym space; do
              echo "=== $core ELF and Android dependencies ==="
              file "$core.so"
              readelf -d "$core.so" | grep NEEDED || true
            done
          } | tee host-environment.txt
          set +e
          for core in sym space; do
            timeout 60s ./probe "$PWD/$core.so" > "$core-result.txt" 2>&1
            rc=$?
            printf 'EXIT_CODE=%s\n' "$rc" >> "$core-result.txt"
            echo "=== native Linux $core ==="
            cat "$core-result.txt"
          done
          set -e
          # Report inability to load Android libraries as a failed experiment;
          # do not equate a Linux dlopen with successful Android initialization.
          grep -q '^EXIT_CODE=0$' sym-result.txt && grep -q '^EXIT_CODE=0$' space-result.txt
      - name: Save host experiment logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-arm64-linux-core-logs
          path: /tmp/native-arm-probe/*.txt
          if-no-files-found: warn
          retention-days: 3
