name: Build APK

# Why CI instead of a local build:
#
# The sandbox this fork was developed in has 2 cores and 2 GB of RAM, so a
# build takes 31-33 minutes and the Kotlin compiler has to be forced
# in-process to avoid the OOM killer. Worse, the toolchain is wiped between
# sessions, so every attempt re-downloads the JDK, the SDK and a 3 GB NDK.
#
# A GitHub runner has 4 cores and 16 GB, caches Gradle between runs, and the
# result is reproducible by anyone. ubuntu-latest specifically: Eden's native
# build is CMake + NDK and is developed against Linux; windows-latest would
# add path-length and line-ending failures for no benefit.

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "debug keeps every symbol; release runs R8 and compresses the dex"
        type: choice
        options: [debug, release]
        default: debug
      upload_to_gofile:
        description: "Also upload the APK to gofile.io"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'patch/**'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out this fork
        uses: actions/checkout@v4
        with:
          path: fork

      - name: Check out upstream Eden
        run: |
          # depth 50 rather than 1: git apply --3way needs history to resolve
          # a context mismatch instead of failing outright. The depth flag was
          # described here in a comment and missing from the command itself,
          # so every run cloned the FULL history - and on 04.11.2026 that took
          # longer than any timeout we set and the whole run was lost.
          #
          # Retried, and bounded every time. git.eden-emu.dev answered 502
          # mid-build once and took the run down with it; it has also hung
          # without closing the connection, which is worse - the job sits
          # there until the 90-minute limit.
          #
          # There is no mirror to fall back to: sj0404-collab/eden-upstream-reference
          # answers 404 and has for a while, so the old fallback was a path
          # that could never work. A failed clone now says so instead of
          # pretending a backup exists.
          ok=0
          for attempt in 1 2 3 4; do
            rm -rf eden
            if timeout 600 git clone --depth 50 --single-branch --branch v0.2.1 \
                 https://git.eden-emu.dev/eden-emu/eden.git eden 2>/tmp/clone.log; then
              ok=1; break
            fi
            echo "attempt $attempt failed:"; tail -3 /tmp/clone.log
            sleep $((attempt * 10))
          done

          if [ "$ok" != 1 ]; then
            echo "::error::upstream Eden is unreachable after 4 attempts (v0.2.1)"
            tail -20 /tmp/clone.log
            exit 1
          fi

          cd eden
          rev=$(git rev-parse HEAD)
          echo "upstream: $(git rev-parse --short HEAD)"
          expected=58c1e20ee58efa3900ba616207d460886214480b
          if [ "$rev" != "$expected" ]; then
            echo "::error::wrong upstream commit: $rev (expected v0.2.1)"
            exit 1
          fi
          echo "  ok   upstream is v0.2.1"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK, CMake and glslang
        run: |
          sdkmanager --install "ndk;28.2.13676358" "cmake;3.31.6" "build-tools;35.0.0" "platforms;android-36"
          sudo apt-get update -qq
          # libzstd-dev — не для сборки APK, а для теста распаковки NSZ: без
          # него tools/run_tests.sh отказывается работать, потому что «NSZ не
          # распаковывается» уже один раз доехало до пользователя.
          sudo apt-get install -y glslang-tools libzstd-dev

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('fork/patch/**') }}
          restore-keys: gradle-${{ runner.os }}-

      # ── Кэш объектов C++ ────────────────────────────────────────────
      #
      # 1353 объекта пересобираются каждый раз, а патч трогает Kotlin.
      # Замерено на build2.yml: 25 минут -> 2-3 минуты, попаданий 99.94%.
      #
      # Путь ДОЛЖЕН совпадать с CCACHE_DIR ниже: в первой попытке кэш
      # сохранялся в ~/.ccache, а ccache писал в ~/.cache/ccache, и вся
      # затея молча не работала.
      - name: Cache the C++ objects
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          # НЕ github.run_number. Номер прогона каждый раз новый, значит
          # сборка #47 клала кэш под именем -47, а #48 искала -48 и не
          # находила: "Cache not found for input keys", 0.86% попаданий и
          # тридцать минут компиляции с нуля. Запасной поиск по префиксу
          # спасал только когда предыдущая сборка успевала дойти до шага
          # сохранения - а падавшие не доходили, и так три раза подряд.
          #
          # Ключ теперь зависит от того, что реально влияет на объекты C++:
          # версии апстрима и содержимого патча, который трогает .cpp. Тот
          # же код - тот же ключ - прямое попадание.
          key: ccache-symbiosis-v0.2.1-${{ inputs.build_type || 'debug' }}-${{ hashFiles('fork/patch/upstream_changes.patch', 'fork/patch/native_symbiosis.cpp') }}
          restore-keys: |
            ccache-symbiosis-v0.2.1-${{ inputs.build_type || 'debug' }}-
            ccache-symbiosis-v0.2.1-
            ccache-symbiosis-

      - name: Set up ccache
        run: |
          sudo apt-get install -y -qq ccache > /dev/null
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
          export CCACHE_DIR="$HOME/.cache/ccache"
          mkdir -p "$CCACHE_DIR"
          ccache --set-config=max_size=3G
          # Абсолютные пути и mtime компилятора на новом раннере каждый раз
          # другие - без этих трёх настроек не совпадало даже то, что
          # только что собрали.
          ccache --set-config=base_dir="$GITHUB_WORKSPACE"
          ccache --set-config=hash_dir=false
          ccache --set-config=compiler_check=content
          ccache --zero-stats
          ccache --show-config | grep -E "max_size|cache_dir|base_dir"

      - name: Build libopenal.so for the second core
        # ЗАЧЕМ ЭТОТ ШАГ. `deviceInitialize` первым делом создаёт
        # OpenALHardwareDeviceDriver, то есть зовёт alcOpenDevice через
        # P/Invoke в libopenal.so. В Android такой библиотеки нет, а в Eden
        # её и не было: вызов падал с DllNotFoundException внутри
        # [UnmanagedCallersOnly], .NET убивал процесс, и игра закрывалась
        # чёрным экраном без единого слова. Оригинальный Kenji собирает
        # openal-soft из подмодуля и кладёт libopenal.so рядом с ядром —
        # делаем так же, из их же форка (в нём есть выравнивание страниц
        # 16 КБ, которое требует наше ядро).
        run: |
          NDK="$(ls -d "$ANDROID_HOME/ndk/"* | head -1)"
          echo "NDK: $NDK"
          git clone --depth 1 https://git.ryujinx.app/kenji-nx/openal-soft.git /tmp/openal-soft
          cmake -S /tmp/openal-soft -B /tmp/openal-build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBTYPE=SHARED \
            -DALSOFT_EXAMPLES=OFF \
            -DALSOFT_UTILS=OFF \
            -DALSOFT_TESTS=OFF \
            -DALSOFT_INSTALL=OFF
          cmake --build /tmp/openal-build -j"$(nproc)" --target OpenAL
          SO="$(find /tmp/openal-build -name 'libopenal.so*' -type f | head -1)"
          [ -n "$SO" ] || { echo "::error::libopenal.so не собрался"; exit 1; }
          cp "$SO" fork/patch/libs/arm64-v8a/libopenal.so
          ls -l fork/patch/libs/arm64-v8a/

      - name: Apply the Symbiosis patch
        run: |
          cd eden
          bash "$GITHUB_WORKSPACE/fork/tools/apply_patch.sh" \
            --patch "$GITHUB_WORKSPACE/fork/patch" --eden "$GITHUB_WORKSPACE/eden"

      - name: Check for duplicate resources
        # aapt2 only reports this ~20 minutes into the build, after the whole
        # native core has compiled, and does not say which file is at fault.
        # A duplicate that upstream already defines is the usual cause.
        run: python3 fork/tools/check_resources.py eden/src/android/app/src/main/res

      - name: Check JNI names match on both sides
        run: |
          # JNI binds by name at runtime: a mismatch compiles, links, ships and
          # then throws UnsatisfiedLinkError the first time the feature is
          # used. The mangling trap is that an underscore already in a name
          # becomes _1, so yuzu_emu must be written yuzu_1emu - the easiest
          # possible typo, and invisible until it crashes.
          python3 fork/tools/check_jni_names.py --patch fork/patch

      - name: Check Kotlin references resolve
        run: |
          # A missing import only surfaces at compileLegacyDebugKotlin, which
          # is twenty-three minutes into the build - after the entire native
          # tree has compiled. That cost one full run for KenjiProbeService.
          python3 fork/tools/check_kotlin_refs.py --patch fork/patch

      - name: Check Kotlin braces and comments balance
        run: |
          # An unterminated block comment swallows the rest of the file, and the
          # compiler then reports "Unresolved reference" in an unrelated place.
          # That cost a full run: a doc comment spelling Logs/*.log opens a
          # nested comment in Kotlin. This check is instant.
          python3 fork/tools/check_kotlin_syntax.py fork/patch

      - name: Check string references resolve
        # aapt2 reports a missing @string only at resource-link time, roughly
        # twenty minutes into the build. This is the same check in a second.
        run: python3 fork/tools/check_string_refs.py eden/src/android/app/src/main/res

      - name: Run host tests
        # These gate the build deliberately: each was written after a bug
        # reached the user, and each fails against the code that shipped it.
        run: |
          # Ubuntu 24.04 packages fmt 9, but Eden's logging.h calls
          # format.get(), added in fmt 10. Build against the version Eden
          # expects rather than the distribution one.
          git clone --depth 1 --branch 10.2.1 https://github.com/fmtlib/fmt.git /tmp/fmt
          export FMT_INCLUDE=/tmp/fmt/include
          curl -sL -o /tmp/kc.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q /tmp/kc.zip -d /tmp
          export PATH="/tmp/kotlinc/bin:$PATH"
          python3 fork/tests/test_kenji_input_contract.py
          python3 fork/tests/test_game_session_contract.py
          python3 fork/tests/test_kenji_window_ref.py
          python3 fork/tests/test_kenji_loader_error.py
          python3 fork/tests/test_kenji_ui_response_gate.py
          python3 fork/tests/test_kenji_ui_native.py
          python3 fork/tests/test_kenji_release_guard.py
          python3 fork/tests/test_core_settings_screen.py
          python3 fork/tests/test_hid_remap_model.py
          git -C eden show HEAD:src/hid_core/resources/npad/npad_resource.cpp > /tmp/original-eden-npad-resource.cpp
          EDEN_NPAD_RESOURCE=/tmp/original-eden-npad-resource.cpp python3 fork/tests/test_hid_710_experiment.py
          git -C eden show HEAD:src/android/app/src/main/java/org/yuzu/yuzu_emu/overlay/InputOverlay.kt > /tmp/original-eden-overlay.kt
          EDEN_OVERLAY_SOURCE=/tmp/original-eden-overlay.kt python3 fork/tests/test_eden_kenji_overlay.py
          bash fork/tools/run_tests.sh --eden "$GITHUB_WORKSPACE/eden" --max-skip 3

      - name: Block release while known Kenji callbacks are empty
        run: python3 fork/tools/check_kenji_release_ready.py

      - name: Check the Russian localisation
        run: |
          cd eden/src/android/app/src/main/res
          python3 - <<'PY'
          import xml.etree.ElementTree as ET, re, sys
          def load(p):
              return {e.get('name'): ''.join(e.itertext())
                      for e in ET.parse(p).getroot().iter('string')}
          en, ru = load('values/strings.xml'), load('values-ru/strings.xml')
          fmt = lambda s: sorted(re.findall(r'%(\d+\$[sd]|[sd%])', s))
          bad = [k for k in ru if k in en and fmt(en[k]) != fmt(ru[k])]
          if bad:
              print('format-argument mismatch:', bad[:5]); sys.exit(1)
          print(f'EN {len(en)} / RU {len(ru)} strings, format arguments agree')
          PY

      - name: Build
        run: |
          cd eden/src/android
          # No --no-daemon: the daemon is what lets Gradle keep the Kotlin
          # compiler warm, and the runner has the memory for it. Also ask
          # CMake for every core - the native compile is the long pole and
          # was previously limited to one worker.
          # Release is what the 25 MB budget refers to. Measured on the debug
          # APK: classes.dex and classes15.dex are 22 MB and are STORED
          # UNCOMPRESSED - the same bytes deflate to 9.2 MB, and R8 removes a
          # good deal more before that. Debug stays the default because it
          # keeps the symbols that make a crash report readable.
          TYPE="${{ inputs.build_type }}"
          TYPE="${TYPE:-debug}"
          # Апстрим уже читает YUZU_ANDROID_ARGS для доп. флагов CMake, так
          # что ccache подключается без правки его build-файлов. Переменные
          # окружения тут НЕ работают: AGP сам вызывает CMake и не передаёт
          # их в этап конфигурации.
          CCACHE_FLAGS="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          if [ "$TYPE" = "release" ]; then
            ./gradlew assembleLegacyRelease -PYUZU_ANDROID_ARGS="$CCACHE_FLAGS" \
              --parallel --build-cache --max-workers="$(nproc)"
          else
            ./gradlew assembleLegacyDebug -PYUZU_ANDROID_ARGS="$CCACHE_FLAGS" \
              --parallel --build-cache --max-workers="$(nproc)"
          fi

      - name: How much the cache saved
        if: always()
        run: ccache --show-stats | head -12

      - name: Verify the fixes actually shipped
        # objdump and dex strings, not a green tick: a build can succeed with
        # a Kotlin file that was never copied into place.
        run: |
          APK=$(find eden -name "*legacy-release.apk" -o -name "*legacy-debug.apk" | head -1)
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          echo "MD5: $(md5sum "$APK" | cut -d' ' -f1)"
          mkdir -p /tmp/x && cd /tmp/x && unzip -qo "$GITHUB_WORKSPACE/$APK" 'classes*.dex' 'lib/*/*.so' 2>/dev/null || \
            unzip -qo "$APK" 'classes*.dex' 'lib/*/*.so'
          fail=0

          # R8 renames Kotlin methods in a release build, so looking for
          # restoreGameDirs there proves nothing and would fail a perfectly
          # good APK. Native symbols survive either way - they are the JNI
          # contract and cannot be renamed - so those are checked always, and
          # the Kotlin names only when they are meant to be present.
          case "$APK" in
            *release*) MINIFIED=1 ;;
            *)         MINIFIED=0 ;;
          esac

          if [ "$MINIFIED" = 0 ]; then
            # Зачем: лаунчер и руководство - это два новых экрана, и оба
            # попадают в APK только если apply_patch.sh их скопировал. Файл,
            # лежащий в patch/, но не в дереве сборки, даёт зелёную сборку с
            # прежним интерфейсом - ровно это и проверяем.
            for sym in restoreGameDirs rememberGameDirs hasActionableButton \
                       NativeLauncherFragment ManualFragment NativeLibraryPresenter \
                       EnginesFragment EngineHybrid EngineStore \
                       PluginsFragment PluginEngine PluginStore \
                       GameFoldersStore GameFolderList ConverterService \
                       Converter ExitTrace DeviceCompat \
                       SavesOverview ProgressMarks CloudSync CloudSettings \
                       WebDavClient WebDavParse SavesFragment CloudFragment \
                       KernelLog KernelLogFormat KernelLogFragment \
                       KernelLogArchive ConverterReasons \
                       SourcesFragment SourceBrowser SourceIndex \
                       SourceRangeServer SourcePlayerActivity \
                       TorrentBencode TorrentMeta TorrentPlan TorrentWire \
                       TorrentTracker TorrentAnnounce TorrentDownload \
                       MagnetMeta FramePacing FrameMetricsText \
                       PerformanceFragment RomSniff KenjiCrash QuickPanel UiGuard; do
              if strings classes*.dex | grep -q "$sym"; then echo "  ok   $sym in dex"
              else echo "  MISSING $sym"; fail=1; fi
            done
          else
            echo "  (release build: Kotlin names are minified, skipping that check)"
          fi

          # Гибрид: экран «Два ядра» и строки к нему. Класс может быть в dex,
          # а строка не доехать — экран тогда покажет пустую подпись. Имена
          # ресурсов лежат в resources.arsc, а не в res/*.xml: там они уже
          # числа, поэтому ищем в таблице ресурсов, в обеих кодировках пула.
          python3 - "$GITHUB_WORKSPACE/$APK" <<'STPY' || fail=1
          import sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          arsc = z.read("resources.arsc")
          for key in ("engine_choice", "launcher_core_kenji", "launcher_properties",
                      "plugins_title", "plugins_description",
                      "converter_title", "folders_add",
                      "cloud_title", "launcher_saves_menu"):
              if key.encode() in arsc or key.encode("utf-16-le") in arsc:
                  print("  ok   string %s is in the resource table" % key)
              else:
                  print("  MISSING string %s" % key)
                  sys.exit(1)
          STPY

          # zstd: пин в дереве сборки. Без него правильный solid-NSZ снова
          # считается битым на arm64 — и APK выглядит рабочим ровно до
          # первого тяжёлого сжатого файла.
          # Путь абсолютный: выше был `cd /tmp/x` для распаковки APK, и
          # относительный `eden/cpmfile.json` там просто не существует —
          # проверка падала на здоровой сборке (прогон 41331469358).
          if grep -q '"33618c8"' "$GITHUB_WORKSPACE/eden/cpmfile.json"; then
            echo "  ok   zstd pinned to 33618c8 in the build tree"
          else
            echo "  MISSING zstd pin (solid NSZ will fail on arm64)"; fail=1
          fi

          # Отчёт и запись падения: класс может доехать, а строки — нет.
          # «Что сказало ядро» без файла stderr не покажет ничего, поэтому
          # проверяются оба имени.
          for text in "kenji-stdout.txt" "ui-crash.txt" "kenji-pid.txt" \
                      "kenji-exit.txt" "kenji-jni.txt" "почему-не-открывается.txt" \
                      "Что сказало ядро перед остановкой" \
                      "Что записала система о конце процесса" \
                      "Что не нашлось в Java за ядро" \
                      "от которого пришёл запрос" \
                      "после загрузки игры" \
                      "Прошлый запуск остановился"; do
            if grep -qa "$text" /tmp/x/classes*.dex; then
              echo "  ok   \"$text\" in dex"
            else
              echo "  MISSING \"$text\" in dex"; fail=1
            fi
          done

          NM=$(find "$ANDROID_HOME/ndk" -name llvm-nm | head -1)
          n=$("$NM" -D lib/arm64-v8a/libyuzu-android.so | grep -c NativeSymbiosis || true)
          echo "  JNI symbols exported: $n"
          [ "$n" -ge 50 ] || { echo "  too few JNI symbols"; fail=1; }

          # Ровность кадров. Счётчик живёт в нативной части, но хунки в самом
          # Eden (perf_stats, sink_stream, vk_pipeline_cache) в APK не попадают:
          # они в libyuzu-android.so как вызовы, а не как экспорт. Поэтому
          # проверяем экспорт JNI и то, что экран действительно лёг в dex:
          # без экрана снимок некому показать.
          for sym in FrameMetricsText FramePacing KenjiInputMap KenjiOverlaySnapshot; do
            if [ "$MINIFIED" = 0 ]; then
              grep -qa "$sym" /tmp/x/classes*.dex \
                || { echo "  missing Kotlin class: $sym"; fail=1; }
            fi
          done
          # Пакет org.yuzu.yuzu_emu в JNI-имени становится yuzu_1emu (подчёркивание
          # кодируется как _1). С yuzu_emu проверка не нашла бы символ, который
          # на месте, и уронила бы сборку после двадцати пяти минут работы.
          for sym in frameMetrics resetFrameMetrics setRomWorkDir; do
            "$NM" -D lib/arm64-v8a/libyuzu-android.so \
              | grep -q "Java_org_yuzu_yuzu_1emu_utils_NativeSymbiosis_$sym" \
              || { echo "  missing JNI export: $sym"; fail=1; }
          done

          # Отчёт о падении второго ядра: и символ включения, и сам обработчик.
          # Отчёт о падении самого приложения: экспорт в libyuzu-android.so.
          # Без него диалог «Прошлый запуск остановился» не получит ничего.
          for sym in armMainCrashLog setMainStep; do
            "$NM" -D lib/arm64-v8a/libyuzu-android.so \
              | grep -q "Java_org_yuzu_yuzu_1emu_utils_NativeSymbiosis_$sym" \
              || { echo "  missing JNI export: $sym"; fail=1; }
          done

          for sym in nativeSetCrashLog nativeSetStep nativeConnectPad nativeUpdateInput nativeInputEventsAvailable nativeInputButton nativeInputStick nativeInputTouch nativeInputSize nativeEnableHidStubLog; do
            "$NM" -D lib/arm64-v8a/libsymbiosis_kenji.so \
              | grep -q "Java_org_yuzu_yuzu_1emu_utils_KenjiBridge_$sym" \
              || { echo "  missing JNI export in the bridge: $sym"; fail=1; }
          done

          # The Kenji bridge, in both names. The core dlopen()s libkenjinxjni
          # and calls debug_break from inside deviceInitialize, so a missing
          # copy is a crash on the first device call rather than a warning.
          for lib in libsymbiosis_kenji.so libkenjinxjni.so; do
            if [ -f "lib/arm64-v8a/$lib" ]; then echo "  ok   $lib present"
            else echo "  MISSING $lib"; fail=1; fi
          done
          for sym in debug_break setRenderingThread setCurrentTransform; do
            if "$NM" -D lib/arm64-v8a/libkenjinxjni.so | grep -q " $sym$"; then
              echo "  ok   $sym exported for the core"
            else echo "  MISSING $sym in libkenjinxjni.so"; fail=1; fi
          done

          # OpenAL: deviceInitialize первым делом создаёт OpenAL-драйвер, и без
          # этой библиотеки процесс умирает внутри ядра — без текста и отчёта.
          if [ -f lib/arm64-v8a/libopenal.so ]; then
            echo "  ok   libopenal.so present ($(stat -c%s lib/arm64-v8a/libopenal.so) байт)"
            if "$NM" -D lib/arm64-v8a/libopenal.so | grep -q " alcOpenDevice$"; then
              echo "  ok   alcOpenDevice exported by libopenal.so"
            else echo "  MISSING alcOpenDevice in libopenal.so"; fail=1; fi
          else
            echo "  MISSING libopenal.so — deviceInitialize упадёт на OpenAL"; fail=1
          fi

          # Порядок вызовов, на котором ядро не работает: deviceInitialize
          # раньше рендерера. Проверяем по dex, что новая подготовка доехала.
          # Читаем распакованные classes*.dex: выше уже был cd /tmp/x, и
          # относительный путь APK здесь уже не открывается.
          if cat classes*.dex | grep -a -q "плеер второго ядра готов"; then
            echo "  ok   подготовка плеера второго ядра в dex"
          else echo "  MISSING подготовка плеера в dex"; fail=1; fi
          if cat classes*.dex | grep -a -q "Второе ядро остановилось"; then
            echo "  ok   отчёт о падении плеера в dex"
          else echo "  MISSING отчёт о падении плеера в dex"; fail=1; fi

          # §48: библиотека больше не отправляет за ключами наугад — она
          # читает контейнер и называет настоящую причину. Проверяем по dex,
          # что разбор и новые тексты доехали до сборки.
          for text in "Это сжатый образ (NSZ)" "внутри образ картриджа (XCI)" \
                      "второе ядро (Kenji)" "билет внутри есть" "нет ключа игры" \
                      "билет без права" "ключи игр (title.keys и дополнительные файлы)" \
                      "общая прошивка Eden: " \
                      "ссылки запрещены, скопировать нечего" \
                      "общая с Eden, " \
                      "ядро считает кадров/с: " \
                      "Что ядро говорит про отрисовку" \
                      "Код завершения 2202-0710" \
                      "Распаковано, но ядро файл не открывает" \
                      "но ни одна не похожа" "ключей игр добавлено" \
                      "прошлый обход библиотеки не закончился" \
                      "один файл покрывает все эти игры сразу" \
                      "правами билета (32 знака)" \
                      "title.keys приведён к виду" \
                      "Ключи: prod.keys и title.keys"; do
            if cat classes*.dex | grep -a -q "$text"; then
              echo "  ok   \"$text\" in dex"
            else echo "  MISSING \"$text\" in dex"; fail=1; fi
          done
          if cat classes*.dex | grep -a -q "NspProbe"; then
            echo "  ok   NspProbe в dex"
          else echo "  MISSING NspProbe в dex"; fail=1; fi

          # What the 25 MB budget is actually about.
          python3 - "$GITHUB_WORKSPACE/$APK" <<'SIZEPY' | tee -a "$GITHUB_STEP_SUMMARY"
          import sys, zipfile, os
          apk = sys.argv[1]
          z = zipfile.ZipFile(apk)
          total = os.path.getsize(apk)
          dex = sum(i.compress_size for i in z.infolist() if i.filename.endswith('.dex'))
          dex_raw = sum(i.file_size for i in z.infolist() if i.filename.endswith('.dex'))
          so = sum(i.compress_size for i in z.infolist() if i.filename.endswith('.so'))
          stored = sum(i.file_size for i in z.infolist() if i.compress_type == 0)
          mb = lambda b: b / 1048576
          print("## APK size")
          print()
          print("| | |")
          print("|---|---|")
          print(f"| APK | **{mb(total):.1f} MB** |")
          print(f"| dex | {mb(dex):.1f} MB packed (from {mb(dex_raw):.1f} MB) |")
          print(f"| native libraries | {mb(so):.1f} MB packed |")
          print(f"| stored uncompressed | {mb(stored):.1f} MB |")
          print()
          print(("Under the 25 MB target." if mb(total) <= 25
                 else f"Over the 25 MB target by {mb(total) - 25:.1f} MB."))
          SIZEPY

          exit $fail

      - name: Upload the APK as an artefact
        uses: actions/upload-artifact@v4
        with:
          name: Eden-Symbiosis-Legacy-debug
          path: eden/src/android/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Upload to gofile.io
        # Default to uploading. inputs.* is empty for a push-triggered run, so
        # the plain condition silently skipped the step and the summary carried
        # no download link - the APK existed only as an artifact, which needs a
        # signed-in browser and expires. Only an explicit false opts out.
        #
        # ТОКЕН ГОСТЯ. С 06.11 gofile отвечает `error-createFolderResponse` на
        # любую заливку без учётки — проверено маленьким файлом на семи
        # серверах. Гостевая учётка даёт токен, и с ним заливка проходит.
        # Значение токена в журнал не печатаем.
        if: github.event_name != 'workflow_dispatch' || inputs.upload_to_gofile
        run: |
          APK=$(find eden -name "*legacy-release.apk" -o -name "*legacy-debug.apk" | head -1)
          TOKEN=$(curl -s -X POST https://api.gofile.io/accounts \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['data']['token'])")
          SRV=$(curl -s https://api.gofile.io/servers | python3 -c "import sys,json;print(json.load(sys.stdin)['data']['servers'][0]['name'])")
          curl -s -m 900 -H "Authorization: Bearer $TOKEN" \
            -F "file=@$APK" "https://$SRV.gofile.io/contents/uploadfile" -o /tmp/up.json
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          try:
              d = json.load(open('/tmp/up.json'))['data']
              print(f"## APK\n\n- **Download:** {d['downloadPage']}\n- **MD5:** `{d['md5']}`\n- **Size:** {round(d['size']/1048576,1)} MB")
          except Exception:
              print("## APK\n\ngofile не принял файл; сборка целая, берите из релиза (шаг ниже) или из артефакта ниже.")
          PY
          cat "$GITHUB_STEP_SUMMARY"

      - name: Publish the APK to the GitHub release
        # «Пришли мне версию с гитхаба» — и вот что человек получал: релиз
        # `symbiosis-latest` от 28 сентября, на 42 МБ, без всех правок месяца.
        # Артефакт скачать нельзя без входа в аккаунт, gofile падает, а
        # постоянной ссылки на свежую сборку не было вовсе.
        #
        # Теперь после каждой успешной сборки один и тот же адрес
        # https://github.com/sj0404-collab/symbiosis/releases/latest/download/Symbiosis.apk
        # отдаёт именно эту сборку. Плюс лежит копия с номером сборки и md5 —
        # чтобы у человека на телефоне оставалось и предыдущее, если новая не
        # подошла.
        # Публикуем только с рабочей ветки: прогон из pull request не должен
        # подменять релиз.
        if: success() && (github.ref_name == 'main' || github.ref_name == 'fix/library-sees-all-games')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Без этого gh ищет локальный git-репозиторий в рабочем каталоге и
          # падает «fatal: not a git repository» — сборка идёт в подпапке.
          # С GH_REPO он ходит в API по имени репозитория и git ему не нужен.
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          APK=$(find eden -name "*legacy-release.apk" -o -name "*legacy-debug.apk" | head -1)
          MD5=$(md5sum "$APK" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$APK")
          MB=$(python3 -c "print(round($SIZE/1048576,1))")
          NAMED="Symbiosis-${GITHUB_RUN_NUMBER}-${MD5:0:8}.apk"
          cp "$APK" "$NAMED"
          # Постоянное имя готовим файлом, а не «$APK#Symbiosis.apk»: этот
          # синтаксис gh в прогоне 42262831163 не переименовал, файл лёг как
          # app-legacy-debug.apk, а прежний Symbiosis.apk остался от сентября.
          cp "$APK" Symbiosis.apk

          gh release view symbiosis-latest >/dev/null 2>&1 || \
            gh release create symbiosis-latest --title "Symbiosis" --notes "Свежая сборка приложения."

          {
            echo "Сборка $GITHUB_RUN_NUMBER, коммит ${GITHUB_SHA:0:7}."
            echo ""
            # Без обратных кавычек: в bash они значат «выполнить как команду»,
            # и строка MD5 уезжала в описание пустой.
            echo "- MD5: $MD5"
            echo "- Размер: $MB МБ"
            echo "- Сборка: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo ""
            echo "Постоянная ссылка на последнюю сборку:"
            echo "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/Symbiosis.apk"
          } > /tmp/notes.md

          # Постоянное имя: ссылка /latest/download/ никогда не меняется.
          gh release upload symbiosis-latest Symbiosis.apk --clobber
          # Копия с номером сборки: предыдущие не затираются.
          gh release upload symbiosis-latest "$NAMED" --clobber
          gh release edit symbiosis-latest --notes-file /tmp/notes.md
          echo "### Релиз обновлён" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/Symbiosis.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "(MD5 $MD5, $MB МБ)" >> "$GITHUB_STEP_SUMMARY"
