name: SSH session

# Opens an SSH session into a GitHub runner that you can attach to from a
# phone, and leaves a full build environment ready in it.
#
# Read the limits before relying on this:
#
#   * A job is killed after 6 hours. That is a platform limit, not a setting.
#     The session dies with it, along with anything not pushed or uploaded.
#   * The runner is disposable. Files you create live only for the session.
#   * It is a terminal, not a desktop. There is no GPU, no Android emulator
#     worth the name, and nothing to point a mouse at - so touch, keyboard and
#     an OTG mouse all end up driving the same text interface.
#   * Anyone holding the session string can run commands as you. The address is
#     printed in the run log; the log is public if the repository is.
#
# How to connect from a phone:
#   1. Actions -> "SSH session" -> Run workflow.
#   2. Open the run, expand "Print connection details".
#   3. Copy the ssh line into Termux (pkg install openssh), JuiceSSH or
#      ConnectBot. The web link in the same step works in a browser with no
#      client at all, which is usually the fastest route on a phone.
#
# Security: with `authorised_only` left on, only keys registered on your GitHub
# account may connect. You currently have none - add one at
# https://github.com/settings/keys - otherwise turn the input off and guard the
# session string instead, because without a key the check would lock you out.

on:
  workflow_dispatch:
    inputs:
      authorised_only:
        description: "Restrict to SSH keys on your GitHub account (needs a key registered)"
        type: boolean
        default: false
      prepare_build:
        description: "Check out Eden and apply the patch before opening the session"
        type: boolean
        default: true
      hours:
        description: "Keep the session open for this long (max 6)"
        type: string
        default: "3"

permissions:
  contents: write

jobs:
  ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          path: fork

      - name: Prepare a build environment
        if: inputs.prepare_build
        run: |
          # Do this before the session opens, so you attach to a runner that is
          # already able to build rather than one that needs ten minutes of
          # setup typed by hand on a phone keyboard.
          git clone --branch v0.2.1 https://git.eden-emu.dev/eden-emu/eden.git eden
          sudo apt-get update -qq
          sudo apt-get install -y glslang-tools libfmt-dev tmux htop
          cd eden
          bash "$GITHUB_WORKSPACE/fork/tools/apply_patch.sh" \
            --patch "$GITHUB_WORKSPACE/fork/patch" --eden "$GITHUB_WORKSPACE/eden"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # setup-android puts sdkmanager on PATH. Without it the step failed with
      # "sdkmanager: command not found" and took the whole session with it.
      - uses: android-actions/setup-android@v4
        if: inputs.prepare_build

      - name: Install NDK and CMake
        if: inputs.prepare_build
        run: sdkmanager --install "ndk;28.2.13676358" "cmake;3.31.6" "build-tools;35.0.0" "platforms;android-36"

      - name: Leave a cheat sheet in the home directory
        run: |
          cat > "$HOME/README-session.txt" <<'EOF'
          Eden Symbiosis - runner session
          ===============================

          Where things are:
            ~/work/symbiosis/eden   upstream v0.2.1, patch already applied
            ~/work/symbiosis/fork   this repository

          Build the APK:
            cd ~/work/symbiosis/eden/src/android
            ./gradlew assembleLegacyDebug --parallel --max-workers=$(nproc)

          The result lands in:
            app/build/outputs/apk/legacy/debug/app-legacy-debug.apk

          Get it off the runner (it dies with the session):
            curl -F "file=@<apk>" https://store-eu-par-2.gofile.io/contents/uploadfile

          Run the tests:
            bash ~/work/symbiosis/fork/tools/run_tests.sh \
              --eden ~/work/symbiosis/eden

          Survive a dropped phone connection - reattach instead of starting over:
            tmux new -s work      # first time
            tmux attach -t work   # after reconnecting

          Machine: $(nproc) cores, $(free -g | awk '/Mem:/{print $2}') GB RAM.
          The job is killed after 6 hours regardless of what is running.
          EOF
          cat "$HOME/README-session.txt"

      - name: Print connection details
        run: |
          echo "The ssh command and web link appear in the next step, which"
          echo "keeps printing them every few seconds while it waits."
          echo "Session limit: ${{ inputs.hours }} hour(s), platform cap 6."

      - name: Open the SSH session
        uses: mxschmitt/action-tmate@v3
        with:
          # When false, anyone with the session string can connect - which is
          # why the string should be treated as a password.
          limit-access-to-actor: ${{ inputs.authorised_only }}
          # Keep going once you detach, so the session is not lost by locking
          # the phone.
          detached: false
