name: Native ARM Android container probe (not a release)
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PROBE_WORK: /tmp/redroid-probe
      KOTLINC_HOME: /tmp/kotlinc
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Build disposable diagnostic harness, never a release APK
        run: |
          set -euo pipefail
          sdkmanager --install 'ndk;28.2.13676358' 'platforms;android-35' 'build-tools;35.0.0'
          curl -fsSL --retry 3 -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q /tmp/kotlin.zip -d /tmp
          bash tests/android_core_probe/build.sh
      - name: Compile self-authored HID matrix NRO in pinned devkitPro image
        run: |
          set -euo pipefail
          IMAGE=devkitpro/devkita64@sha256:82575ea78651b530b2e232bb3799cfd1fe331514e053d5f724bb4b28191fb79d
          docker pull "$IMAGE"
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" --read-only --tmpfs /tmp:rw,nosuid,size=512m \
            --mount "type=bind,src=$PWD/tests/hid_android_matrix,dst=/input,readonly" \
            --mount "type=bind,src=$PROBE_WORK,dst=/output" --entrypoint /bin/bash "$IMAGE" -euc '
              /opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
                -specs=/opt/devkitpro/libnx/switch.specs -march=armv8-a+crc+crypto \
                -mtune=cortex-a57 -mtp=soft -fPIE -O2 -Wall -Wextra \
                -I/opt/devkitpro/libnx/include /input/main.c \
                -L/opt/devkitpro/libnx/lib -lnx -o /output/hid-matrix.elf
              # Both core loaders crash when asset section is absent. Generate
              # real NACP and a real devkitPro default icon; do not stub a loader.
              nacptool --create "CI HID matrix" "Symbiosis CI" "1.0.0" /output/hid-matrix.nacp
              elf2nro /output/hid-matrix.elf /output/hid-matrix.nro \
                --nacp=/output/hid-matrix.nacp --icon=/opt/devkitpro/libnx/default_icon.jpg
              sha256sum /output/hid-matrix.nro
            '
      - name: Compile self-authored modern SDL surface diagnostic
        run: |
          set -euo pipefail
          IMAGE=devkitpro/devkita64@sha256:82575ea78651b530b2e232bb3799cfd1fe331514e053d5f724bb4b28191fb79d
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" --read-only --tmpfs /tmp:rw,nosuid,size=512m \
            --mount "type=bind,src=$PWD/tests/sdl_android_surface,dst=/input,readonly" \
            --mount "type=bind,src=$PROBE_WORK,dst=/output" --entrypoint /bin/bash "$IMAGE" -euc '
              SDL_CONFIG=/opt/devkitpro/portlibs/switch/bin/sdl2-config
              test -x "$SDL_CONFIG"
              "$SDL_CONFIG" --version
              dkp-pacman -Q switch-sdl2 libnx || true
              /opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
                -specs=/opt/devkitpro/libnx/switch.specs -march=armv8-a+crc+crypto \
                -mtune=cortex-a57 -mtp=soft -fPIE -O2 -Wall -Wextra -D__SWITCH__ \
                -I/opt/devkitpro/libnx/include $("$SDL_CONFIG" --cflags) /input/main.c \
                -L/opt/devkitpro/libnx/lib $("$SDL_CONFIG" --libs) -lm -o /output/sdl-surface.elf
              nacptool --create "CI SDL surface" "Symbiosis CI" "1.0.0" /output/sdl-surface.nacp
              elf2nro /output/sdl-surface.elf /output/sdl-surface.nro \
                --nacp=/output/sdl-surface.nacp --icon=/opt/devkitpro/libnx/default_icon.jpg
              sha256sum /output/sdl-surface.nro
            '
      - name: Compile self-authored software keyboard diagnostic
        run: |
          set -euo pipefail
          IMAGE=devkitpro/devkita64@sha256:82575ea78651b530b2e232bb3799cfd1fe331514e053d5f724bb4b28191fb79d
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" --read-only --tmpfs /tmp:rw,nosuid,size=512m \
            --mount "type=bind,src=$PWD/tests/swkbd_android_probe,dst=/input,readonly" \
            --mount "type=bind,src=$PROBE_WORK,dst=/output" --entrypoint /bin/bash "$IMAGE" -euc '
              /opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc \
                -specs=/opt/devkitpro/libnx/switch.specs -march=armv8-a+crc+crypto \
                -mtune=cortex-a57 -mtp=soft -fPIE -O2 -Wall -Wextra \
                -I/opt/devkitpro/libnx/include /input/main.c \
                -L/opt/devkitpro/libnx/lib -lnx -o /output/swkbd.elf
              nacptool --create "CI keyboard probe" "Symbiosis CI" "1.0.0" /output/swkbd.nacp
              elf2nro /output/swkbd.elf /output/swkbd.nro \
                --nacp=/output/swkbd.nacp --icon=/opt/devkitpro/libnx/default_icon.jpg
              sha256sum /output/swkbd.nro
            '
      - name: Transfer temporary test-only harness to the ARM test job
        uses: actions/upload-artifact@v4
        with:
          name: temporary-redroid-tests-not-a-release
          path: |
            /tmp/redroid-probe/core-probe.apk
            /tmp/redroid-probe/core-probe-ui-fixture.apk
            /tmp/redroid-probe/hid-matrix.nro
            /tmp/redroid-probe/sdl-surface.nro
            /tmp/redroid-probe/swkbd.nro
            /tmp/redroid-probe/standalone-core-probe
            /tmp/redroid-probe/standalone.jar
            /tmp/redroid-probe/libstandalonejni.so
            /tmp/redroid-probe/core_sym.so
            /tmp/redroid-probe/core_space.so
            /tmp/redroid-probe/apk/lib/arm64-v8a/libkenjinxjni.so
            /tmp/redroid-probe/apk/lib/arm64-v8a/libcrypto.so
            /tmp/redroid-probe/apk/lib/arm64-v8a/libssl.so
          if-no-files-found: error
          retention-days: 1

  android-on-arm:
    needs: build-probe
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    env:
      PROBE_WORK: /tmp/redroid-probe
      ANDROID_SERIAL: 127.0.0.1:5558
      PROBE_WAIT_SECONDS: '180'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: temporary-redroid-tests-not-a-release
          path: /tmp/redroid-probe
      - name: Install genuine Android Debug Bridge
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends adb
      - name: Boot pinned ARM Android container and run independent probes
        run: bash tests/modern_android_qemu/redroid_probe.sh
      - name: Save logs only (never test APK, cores, or system image)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redroid-arm64-android15-test-logs
          path: |
            /tmp/redroid-probe/redroid-*.txt
            /tmp/redroid-probe/standalone-*.txt
            /tmp/redroid-probe/*-logcat.txt
            /tmp/redroid-probe/*-probe-crash.txt
            /tmp/redroid-probe/*-input-hang-*.txt
            /tmp/redroid-probe/*-input-stage.txt
            /tmp/redroid-probe/*-kenji-stdout.txt
            /tmp/redroid-probe/*-kenji-jni.txt
            /tmp/redroid-probe/*-homebrew-screen.png
            /tmp/redroid-probe/*-snake-before-screen.png
          if-no-files-found: warn
          retention-days: 3
