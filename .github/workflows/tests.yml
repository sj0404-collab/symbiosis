name: Tests

# A fast feedback loop, separate from the APK build.
#
# The full build spends ~25 minutes compiling the emulator before it ever
# reaches a verification step, so a broken test harness costs a full run to
# diagnose. This job clones upstream, applies the patch and runs the suite -
# typically under five minutes - so test problems surface on their own.

on:
  workflow_dispatch:
    inputs:
      run_android_probe:
        description: "Run disposable real-core Android emulator probe after host tests"
        type: boolean
        default: false
      run_arm_linux_probe:
        description: "Run experimental ARM64 Linux/Bionic loader probe (not Android)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'tests/**'
      - 'tools/run_tests.sh'
      - 'patch/symbiosis/**'
      # The chat tests drive the agent and the hub page for real, so a change
      # to either has to run them. Listing only capabilities.js meant the fix
      # for "answers once, then goes silent" - which lives in zen-agent.js and
      # hub/index.html - would have merged without the suite running at all.
      - 'agent/**'
      - '.github/workflows/tests.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          path: fork
          # The version tests read the commit count, and a shallow clone
          # reports 1 no matter how long the history is.
          fetch-depth: 0

      - name: Compare the pinned SymbEK APK and both core binaries
        run: |
          curl -fsSL --retry 3 -o /tmp/symbek-reference.apk \
            https://github.com/sj0404-collab/SymbEK/releases/download/v1.0.121/Kenji-Space-1.0.121.apk
          curl -fsSL --retry 3 -o /tmp/symbiosis-core.so \
            https://github.com/sj0404-collab/symbiosis/releases/download/engine-kenji/libkenji.so
          SYMBEK_APK=/tmp/symbek-reference.apk SYMBIOSIS_CORE=/tmp/symbiosis-core.so \
            python3 fork/tests/test_symbek_reference.py
          SYMBEK_APK=/tmp/symbek-reference.apk python3 fork/tests/test_symbek_graphics_dex.py
          SYMBEK_APK=/tmp/symbek-reference.apk SYMBIOSIS_CORE=/tmp/symbiosis-core.so python3 fork/tests/test_kenji_isa_reference.py
          python3 -m pip install --quiet --target /tmp/isa-test-deps 'unicorn==2.1.4'
          PYTHONPATH=/tmp/isa-test-deps SYMBEK_APK=/tmp/symbek-reference.apk SYMBIOSIS_CORE=/tmp/symbiosis-core.so python3 fork/tests/test_kenji_isa_unicorn.py
          rm -rf /tmp/symbek-reference.apk /tmp/symbiosis-core.so /tmp/isa-test-deps

      - name: Check out upstream Eden
        run: git clone --branch v0.2.1 https://git.eden-emu.dev/eden-emu/eden.git eden

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch fmt 10 (matching Eden)
        # Ubuntu 24.04 packages libfmt 9, but Eden's logging.h calls
        # format.get(), which only exists from fmt 10. Building against the
        # distribution package fails with "has no member named 'get'", so use
        # the version Eden itself expects. Header-only, so no build step.
        run: |
          git clone --depth 1 --branch 10.2.1 https://github.com/fmtlib/fmt.git /tmp/fmt
          echo "FMT_INCLUDE=/tmp/fmt/include" >> "$GITHUB_ENV"
          test -f /tmp/fmt/include/fmt/format.h && echo "fmt 10.2.1 headers ready"

      - name: Apply the Symbiosis patch
        run: |
          cd eden
          bash "$GITHUB_WORKSPACE/fork/tools/apply_patch.sh" \
            --patch "$GITHUB_WORKSPACE/fork/patch" --eden "$GITHUB_WORKSPACE/eden"

      - name: Check for duplicate resources
        # aapt2 only reports this ~20 minutes into the build, after the whole
        # native core has compiled, and does not say which file is at fault.
        # A duplicate that upstream already defines is the usual cause.
        run: python3 fork/tools/check_resources.py eden/src/android/app/src/main/res

      - name: Check string references resolve
        # aapt2 reports a missing @string only at resource-link time, roughly
        # twenty minutes into the build. This is the same check in a second.
        run: python3 fork/tools/check_string_refs.py eden/src/android/app/src/main/res

      - name: Install Kotlin
        run: |
          curl -sL -o /tmp/kc.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q /tmp/kc.zip -d /tmp

      - name: Run the suite
        run: |
          # pwsh is on the ubuntu image, so the PowerShell blueprints are
          # parsed for real rather than skipped. Without it the capability
          # tests still pass - they just report the skip instead of faking it.
          command -v pwsh >/dev/null && pwsh --version || echo "pwsh absent"
          export PATH="/tmp/kotlinc/bin:$PATH"
          python3 fork/tests/test_core_settings_screen.py
          python3 fork/tests/test_kenji_input_contract.py
          python3 fork/tests/test_game_session_contract.py
          python3 fork/tests/test_kenji_window_ref.py
          python3 fork/tests/test_kenji_loader_error.py
          python3 fork/tests/test_kenji_preflight_safety.py
          python3 fork/tests/test_standalone_core_probe.py
          python3 fork/tests/test_kenji_ui_response_gate.py
          python3 fork/tests/test_kenji_ui_shared_event_model.py
          python3 fork/tests/test_kenji_transform_candidate.py
          python3 fork/tests/test_kenji_ui_native.py
          python3 fork/tests/test_kenji_release_guard.py
          python3 fork/tests/test_hid_remap_model.py
          curl -fsSL --retry 3 'https://raw.githubusercontent.com/thiagooo0/EHRyujinx2/1247747ed81ffb6df2d33153e0ba723ec4ffc32b/src/Ryujinx.HLE/HOS/Services/Hid/IHidServer.cs' -o /tmp/related-hid-server.cs
          RELATED_HID_SOURCE=/tmp/related-hid-server.cs python3 fork/tests/test_hid_related_stub.py
          git -C eden show HEAD:src/hid_core/resources/npad/npad_resource.cpp > /tmp/original-eden-npad-resource.cpp
          EDEN_NPAD_RESOURCE=/tmp/original-eden-npad-resource.cpp python3 fork/tests/test_hid_710_experiment.py
          git -C eden show HEAD:src/android/app/src/main/java/org/yuzu/yuzu_emu/overlay/InputOverlay.kt > /tmp/original-eden-overlay.kt
          EDEN_OVERLAY_SOURCE=/tmp/original-eden-overlay.kt python3 fork/tests/test_eden_kenji_overlay.py
          bash fork/tools/run_tests.sh --eden "$GITHUB_WORKSPACE/eden" --max-skip 3

      - name: Check the capability blueprints against a real virtual display
        # The gui_screenshot blueprint is the one users reach for when they ask
        # the agent to "build a program and show me it running". It is the only
        # blueprint whose failure mode is a silent black PNG, so it gets an
        # end-to-end check with a real Xvfb rather than a syntax probe.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb imagemagick python3-tk
          cd fork
          cat > /tmp/demo_app.py <<'PY'
          import tkinter as tk
          root = tk.Tk()
          root.geometry("400x200")
          root.configure(bg="#101820")
          tk.Label(root, text="capability check", fg="#58a6ff", bg="#101820",
                   font=("DejaVu Sans", 20)).pack(expand=True)
          root.mainloop()
          PY
          node -e '
            const { createCapabilities } = require("./agent/capabilities.js");
            const caps = createCapabilities({
              workspaceRoot: () => "/tmp",
              commandEnvironment: () => ({ ...process.env }),
              resolvePath: i => ({ path: require("path").resolve("/tmp", String(i)) }),
              auditEvent: () => {}
            });
            (async () => {
              await caps.handle("capability_create", { name: "ci_shots", template: "gui_screenshot", overwrite: true });
              const r = await caps.handle("capability_run", {
                name: "ci_shots",
                args: { command: "python3 /tmp/demo_app.py", seconds: 5, shots: 1 }
              });
              const shots = (r.result && r.result.screenshots) || [];
              if (!r.success || shots.length !== 1) {
                console.error("capability run failed:", JSON.stringify(r, null, 2));
                process.exit(1);
              }
              console.log("screenshot captured:", shots[0].file, shots[0].bytes, "bytes");
              if (shots[0].bytes < 2000) { console.error("PNG suspiciously small - blank screen?"); process.exit(1); }
            })();
          '

      - name: Check the Russian localisation
        run: |
          cd eden/src/android/app/src/main/res
          python3 - <<'PY'
          import xml.etree.ElementTree as ET, re, sys
          def load(p):
              return {e.get('name'): ''.join(e.itertext())
                      for e in ET.parse(p).getroot().iter('string')}
          en, ru = load('values/strings.xml'), load('values-ru/strings.xml')
          fmt = lambda s: sorted(re.findall(r'%(\d+\$[sd]|[sd%])', s))
          bad = [k for k in ru if k in en and fmt(en[k]) != fmt(ru[k])]
          if bad:
              print('format-argument mismatch:', bad[:5]); sys.exit(1)
          print(f'EN {len(en)} / RU {len(ru)} strings, format arguments agree')
          PY

  core-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.run_android_probe == true
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROBE_WORK: /tmp/sym-core-ci
      KOTLINC_HOME: /tmp/kotlinc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install test toolchain
        run: |
          sdkmanager --install 'ndk;28.2.13676358' 'platforms;android-35' 'build-tools;35.0.0'
          curl -fsSL --retry 3 -o /tmp/kc.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q /tmp/kc.zip -d /tmp
      - name: Build disposable probe with real bridge and real cores
        run: bash tests/android_core_probe/build.sh
      - name: Enable KVM access
        run: |
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Try both cores in separate emulator processes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tests/android_core_probe/run.sh
      - name: Save emulator logs (no probe APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-core-probe-logs
          path: |
            /tmp/sym-core-ci/*-logcat.txt
            /tmp/sym-core-ci/*-probe-crash.txt
            /tmp/sym-core-ci/*-kenji-stdout.txt
            /tmp/sym-core-ci/*-kenji-jni.txt
          if-no-files-found: warn
          retention-days: 3

  # A separate, disposable software ARM experiment; not a release build.
  # The calling workflow is already registered on the repository's default
  # branch, so branch-local changes can invoke this reusable workflow.
  software-arm64-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.run_android_probe == true
    uses: ./.github/workflows/arm64-software-probe.yml

  # Native ARM64 Linux + authentic Android Bionic, strictly loader-only.
  direct-arm-linux-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.run_arm_linux_probe == true
    uses: ./.github/workflows/arm64-linux-bionic-probe.yml
