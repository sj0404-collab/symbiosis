name: Tests

# A fast feedback loop, separate from the APK build.
#
# The full build spends ~25 minutes compiling the emulator before it ever
# reaches a verification step, so a broken test harness costs a full run to
# diagnose. This job clones upstream, applies the patch and runs the suite -
# typically under five minutes - so test problems surface on their own.

on:
  workflow_dispatch:
    inputs:
      run_android_probe:
        description: "Run disposable real-core Android emulator probe after host tests"
        type: boolean
        default: false
      run_arm_linux_probe:
        description: "Run experimental ARM64 Linux/Bionic loader probe (not Android)"
        type: boolean
        default: false
      run_modern_arm_probe:
        description: "Try a full Android 15 ARM system on software QEMU"
        type: boolean
        default: false
      run_android35_backend:
        description: "Try Android Emulator backend with ARM Android 15 (unsupported software mode)"
        type: boolean
        default: false
      run_native_arm_emulator:
        description: "Try community-built ARM-host Android emulator in software mode (no release)"
        type: boolean
        default: false
      run_player_runtime:
        description: "Build and run disposable actual player on ARM Android (not release)"
        type: boolean
        default: false
      run_player_guest_network:
        description: "Test loopback socket binding matrix in disposable player"
        type: boolean
        default: false
      run_player_hid_long:
        description: "Observe HID and test account service IPC in disposable player"
        type: boolean
        default: false
      run_player_guest_tls:
        description: "Try guest SSL service with local test server (not release)"
        type: boolean
        default: false
      run_player_guest_tls_auto_bind:
        description: "Test guest TLS using automatic socket binding (not release)"
        type: boolean
        default: false
      run_player_ssl_count:
        description: "Check SSL context connection lifecycle in research core"
        type: boolean
        default: false
      run_player_reference_ssl_count_patch:
        description: "Enable SSL connection count candidate (research only)"
        type: boolean
        default: false
      run_player_tls_parallel:
        description: "Test concurrent guest TLS contexts (research only)"
        type: boolean
        default: false
      run_player_compare_space:
        description: "Test pinned SymbEK core in disposable player (not a release)"
        type: boolean
        default: false
      run_player_tls_candidate:
        description: "Use test-only OpenSSL 3.5 in disposable player (not a release)"
        type: boolean
        default: false
      run_player_bundled_tls:
        description: "Verify actual bundled OpenSSL in disposable player"
        type: boolean
        default: false
      run_reference_core_compile:
        description: "Build pinned public Kenji source for research only, not release"
        type: boolean
        default: false
      run_player_reference_core:
        description: "Run pinned-source research core in disposable player (not release)"
        type: boolean
        default: false
      run_player_reference_tls_patch:
        description: "Try experimental SSL source patch (research only, never release)"
        type: boolean
        default: false
      run_player_reference_network_patch:
        description: "Try experimental source socket-binding patch (not release)"
        type: boolean
        default: false
      run_player_reference_missing_interface:
        description: "Use nonexistent interface in research-only negative test"
        type: boolean
        default: false
      run_player_reference_zero_interface:
        description: "Test zero auto sentinel in research core"
        type: boolean
        default: false
      run_player_reference_valid_interface:
        description: "Test explicit loopback adapter in research core"
        type: boolean
        default: false
      run_player_compile:
        description: "Compile real patched app Kotlin without assembling or releasing an APK"
        type: boolean
        default: false
      run_redroid_probe:
        description: "Test real Android ARM container and disposable harness (no release)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'tests/**'
      - 'tools/run_tests.sh'
      - 'patch/symbiosis/**'
      # The chat tests drive the agent and the hub page for real, so a change
      # to either has to run them. Listing only capabilities.js meant the fix
      # for "answers once, then goes silent" - which lives in zen-agent.js and
      # hub/index.html - would have merged without the suite running at all.
      - 'agent/**'
      - '.github/workflows/tests.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          path: fork
          # The version tests read the commit count, and a shallow clone
          # reports 1 no matter how long the history is.
          fetch-depth: 0

      - name: Compare the pinned SymbEK APK and both core binaries
        run: |
          curl -fsSL --retry 3 -o /tmp/symbek-reference.apk \
            https://github.com/sj0404-collab/SymbEK/releases/download/v1.0.121/Kenji-Space-1.0.121.apk
          curl -fsSL --retry 3 -o /tmp/symbiosis-core.so \
            https://github.com/sj0404-collab/symbiosis/releases/download/engine-kenji/libkenji.so
          SYMBEK_APK=/tmp/symbek-reference.apk SYMBIOSIS_CORE=/tmp/symbiosis-core.so \
            python3 fork/tests/test_symbek_reference.py
          SYMBEK_APK=/tmp/symbek-reference.apk python3 fork/tests/test_symbek_graphics_dex.py
          SYMBEK_APK=/tmp/symbek-reference.apk SYMBIOSIS_CORE=/tmp/symbiosis-core.so python3 fork/tests/test_kenji_isa_reference.py
          python3 -m pip install --quiet --target /tmp/isa-test-deps 'unicorn==2.1.4'
          PYTHONPATH=/tmp/isa-test-deps SYMBEK_APK=/tmp/symbek-reference.apk SYMBIOSIS_CORE=/tmp/symbiosis-core.so python3 fork/tests/test_kenji_isa_unicorn.py
          rm -rf /tmp/symbek-reference.apk /tmp/symbiosis-core.so /tmp/isa-test-deps

      - name: Check out upstream Eden
        run: git clone --branch v0.2.1 https://git.eden-emu.dev/eden-emu/eden.git eden

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch fmt 10 (matching Eden)
        # Ubuntu 24.04 packages libfmt 9, but Eden's logging.h calls
        # format.get(), which only exists from fmt 10. Building against the
        # distribution package fails with "has no member named 'get'", so use
        # the version Eden itself expects. Header-only, so no build step.
        run: |
          git clone --depth 1 --branch 10.2.1 https://github.com/fmtlib/fmt.git /tmp/fmt
          echo "FMT_INCLUDE=/tmp/fmt/include" >> "$GITHUB_ENV"
          test -f /tmp/fmt/include/fmt/format.h && echo "fmt 10.2.1 headers ready"

      - name: Apply the Symbiosis patch
        run: |
          cd eden
          bash "$GITHUB_WORKSPACE/fork/tools/apply_patch.sh" \
            --patch "$GITHUB_WORKSPACE/fork/patch" --eden "$GITHUB_WORKSPACE/eden"

      - name: Check for duplicate resources
        # aapt2 only reports this ~20 minutes into the build, after the whole
        # native core has compiled, and does not say which file is at fault.
        # A duplicate that upstream already defines is the usual cause.
        run: python3 fork/tools/check_resources.py eden/src/android/app/src/main/res

      - name: Check string references resolve
        # aapt2 reports a missing @string only at resource-link time, roughly
        # twenty minutes into the build. This is the same check in a second.
        run: python3 fork/tools/check_string_refs.py eden/src/android/app/src/main/res

      - name: Install Kotlin
        run: |
          curl -sL -o /tmp/kc.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q /tmp/kc.zip -d /tmp

      - name: Run the suite
        run: |
          # pwsh is on the ubuntu image, so the PowerShell blueprints are
          # parsed for real rather than skipped. Without it the capability
          # tests still pass - they just report the skip instead of faking it.
          command -v pwsh >/dev/null && pwsh --version || echo "pwsh absent"
          export PATH="/tmp/kotlinc/bin:$PATH"
          python3 fork/tests/test_core_settings_screen.py
          python3 fork/tests/test_kenji_input_contract.py
          python3 fork/tests/test_game_session_contract.py
          python3 fork/tests/test_kenji_window_ref.py
          python3 fork/tests/test_kenji_loader_error.py
          python3 fork/tests/test_kenji_preflight_safety.py
          python3 fork/tests/test_standalone_core_probe.py
          python3 fork/tests/test_standalone_tls_jni.py
          python3 fork/tests/test_standalone_tls_handshake.py
          python3 fork/tests/test_player_tls_audit.py
          python3 fork/tests/test_player_stop_observer.py
          python3 fork/tests/test_guest_tls_harness.py
          python3 fork/tests/test_guest_tls_evidence.py
          python3 fork/tests/test_ssl_count_candidate.py
          python3 fork/tests/test_guest_network_harness.py
          python3 fork/tests/test_hid_long_evidence.py
          python3 fork/tests/test_tls_parallel_harness.py
          python3 fork/tests/test_standalone_gpt.py
          python3 fork/tests/test_standalone_log_capture.py
          python3 fork/tests/test_standalone_property_init.py
          python3 fork/tests/test_standalone_binderfs.py
          python3 fork/tests/test_android_probe_outcome.py
          python3 fork/tests/test_kenji_ui_response_gate.py
          python3 fork/tests/test_kenji_ui_shared_event_model.py
          python3 fork/tests/test_kenji_transform_candidate.py
          python3 fork/tests/test_kenji_ui_native.py
          python3 fork/tests/test_kenji_ui_callback_wiring.py
          python3 fork/tests/test_kenji_player_ui_contract.py
          python3 fork/tests/test_kenji_release_guard.py
          python3 fork/tests/test_account_failure_diagnostic.py
          python3 fork/tests/test_guest_account_evidence.py
          python3 fork/tests/test_experimental_build_policy.py
          python3 fork/tests/test_sign_core_manifest.py
          python3 fork/tests/test_core_update_wiring.py
          python3 fork/tests/test_process_exit_wiring.py
          python3 fork/tests/test_kenji_log_performance.py
          python3 fork/tests/test_kenji_ffmpeg_contract.py
          python3 fork/tests/test_core_benchmark_wiring.py
          python3 fork/tests/test_hid_remap_model.py
          curl -fsSL --retry 3 'https://raw.githubusercontent.com/thiagooo0/EHRyujinx2/1247747ed81ffb6df2d33153e0ba723ec4ffc32b/src/Ryujinx.HLE/HOS/Services/Hid/IHidServer.cs' -o /tmp/related-hid-server.cs
          RELATED_HID_SOURCE=/tmp/related-hid-server.cs python3 fork/tests/test_hid_related_stub.py
          git -C eden show HEAD:src/hid_core/resources/npad/npad_resource.cpp > /tmp/original-eden-npad-resource.cpp
          EDEN_NPAD_RESOURCE=/tmp/original-eden-npad-resource.cpp python3 fork/tests/test_hid_710_experiment.py
          git -C eden show HEAD:src/android/app/src/main/java/org/yuzu/yuzu_emu/overlay/InputOverlay.kt > /tmp/original-eden-overlay.kt
          EDEN_OVERLAY_SOURCE=/tmp/original-eden-overlay.kt python3 fork/tests/test_eden_kenji_overlay.py
          bash fork/tools/run_tests.sh --eden "$GITHUB_WORKSPACE/eden" --max-skip 3

      - name: Check the capability blueprints against a real virtual display
        # The gui_screenshot blueprint is the one users reach for when they ask
        # the agent to "build a program and show me it running". It is the only
        # blueprint whose failure mode is a silent black PNG, so it gets an
        # end-to-end check with a real Xvfb rather than a syntax probe.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb imagemagick python3-tk
          cd fork
          cat > /tmp/demo_app.py <<'PY'
          import tkinter as tk
          root = tk.Tk()
          root.geometry("400x200")
          root.configure(bg="#101820")
          tk.Label(root, text="capability check", fg="#58a6ff", bg="#101820",
                   font=("DejaVu Sans", 20)).pack(expand=True)
          root.mainloop()
          PY
          node -e '
            const { createCapabilities } = require("./agent/capabilities.js");
            const caps = createCapabilities({
              workspaceRoot: () => "/tmp",
              commandEnvironment: () => ({ ...process.env }),
              resolvePath: i => ({ path: require("path").resolve("/tmp", String(i)) }),
              auditEvent: () => {}
            });
            (async () => {
              await caps.handle("capability_create", { name: "ci_shots", template: "gui_screenshot", overwrite: true });
              const r = await caps.handle("capability_run", {
                name: "ci_shots",
                args: { command: "python3 /tmp/demo_app.py", seconds: 5, shots: 1 }
              });
              const shots = (r.result && r.result.screenshots) || [];
              if (!r.success || shots.length !== 1) {
                console.error("capability run failed:", JSON.stringify(r, null, 2));
                process.exit(1);
              }
              console.log("screenshot captured:", shots[0].file, shots[0].bytes, "bytes");
              if (shots[0].bytes < 2000) { console.error("PNG suspiciously small - blank screen?"); process.exit(1); }
            })();
          '

      - name: Check the Russian localisation
        run: |
          cd eden/src/android/app/src/main/res
          python3 - <<'PY'
          import xml.etree.ElementTree as ET, re, sys
          def load(p):
              return {e.get('name'): ''.join(e.itertext())
                      for e in ET.parse(p).getroot().iter('string')}
          en, ru = load('values/strings.xml'), load('values-ru/strings.xml')
          fmt = lambda s: sorted(re.findall(r'%(\d+\$[sd]|[sd%])', s))
          bad = [k for k in ru if k in en and fmt(en[k]) != fmt(ru[k])]
          if bad:
              print('format-argument mismatch:', bad[:5]); sys.exit(1)
          print(f'EN {len(en)} / RU {len(ru)} strings, format arguments agree')
          PY

  core-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.run_android_probe == true
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROBE_WORK: /tmp/sym-core-ci
      KOTLINC_HOME: /tmp/kotlinc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install test toolchain
        run: |
          sdkmanager --install 'ndk;28.2.13676358' 'platforms;android-35' 'build-tools;35.0.0'
          curl -fsSL --retry 3 -o /tmp/kc.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q /tmp/kc.zip -d /tmp
      - name: Build disposable probe with real bridge and real cores
        run: bash tests/android_core_probe/build.sh
      - name: Enable KVM access
        run: |
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Try both cores in separate emulator processes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tests/android_core_probe/run.sh
      - name: Save emulator logs (no probe APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-core-probe-logs
          path: |
            /tmp/sym-core-ci/*-logcat.txt
            /tmp/sym-core-ci/*-probe-crash.txt
            /tmp/sym-core-ci/*-kenji-stdout.txt
            /tmp/sym-core-ci/*-kenji-jni.txt
          if-no-files-found: warn
          retention-days: 3

  # A separate, disposable software ARM experiment; not a release build.
  # The calling workflow is already registered on the repository's default
  # branch, so branch-local changes can invoke this reusable workflow.
  software-arm64-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.run_android_probe == true
    uses: ./.github/workflows/arm64-software-probe.yml

  # Native ARM64 Linux + authentic Android Bionic, strictly loader-only.
  direct-arm-linux-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.run_arm_linux_probe == true
    uses: ./.github/workflows/arm64-linux-bionic-probe.yml

  # Experimental full system Android boot, no APK and no games.
  modern-arm-qemu-boot:
    if: github.event_name == 'workflow_dispatch' && inputs.run_modern_arm_probe == true
    uses: ./.github/workflows/modern-arm-qemu-boot.yml

  # Official graphics backend in unsupported software ARM-on-x86 mode; never release.
  android35-emulator-backend:
    if: github.event_name == 'workflow_dispatch' && inputs.run_android35_backend == true
    uses: ./.github/workflows/android35-emulator-backend.yml

  # Independent third-party AOSP emulator build on an ARM host; no KVM or APK.
  native-arm-android-emulator:
    if: github.event_name == 'workflow_dispatch' && inputs.run_native_arm_emulator == true
    uses: ./.github/workflows/arm-native-android-emulator.yml

  # ARM Android userspace on a native ARM host, not the Google emulator or a phone.
  arm-redroid-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.run_redroid_probe == true
    uses: ./.github/workflows/arm-redroid-probe.yml

  # Compile the real patched app only; no APK, no publication, guard unchanged.
  kenji-player-compile:
    if: github.event_name == 'workflow_dispatch' && inputs.run_player_compile == true
    uses: ./.github/workflows/kenji-player-compile.yml

  # Actual player with a test-only launcher and NRO; never a release APK.
  kenji-player-runtime:
    if: github.event_name == 'workflow_dispatch' && inputs.run_player_runtime == true
    uses: ./.github/workflows/kenji-player-runtime.yml
    with:
      tls_candidate: ${{ inputs.run_player_tls_candidate == true }}
      bundled_tls_probe: ${{ inputs.run_player_bundled_tls == true }}
      compare_space: ${{ inputs.run_player_compare_space == true }}
      guest_tls: ${{ inputs.run_player_guest_tls == true }}
      guest_tls_auto_bind: ${{ inputs.run_player_guest_tls_auto_bind == true }}
      ssl_count: ${{ inputs.run_player_ssl_count == true }}
      reference_ssl_count_patch: ${{ inputs.run_player_reference_ssl_count_patch == true }}
      tls_parallel: ${{ inputs.run_player_tls_parallel == true }}
      guest_network: ${{ inputs.run_player_guest_network == true }}
      hid_long: ${{ inputs.run_player_hid_long == true }}
      guest_account: ${{ inputs.run_player_hid_long == true }}
      reference_core: ${{ inputs.run_player_reference_core == true }}
      reference_tls_patch: ${{ inputs.run_player_reference_tls_patch == true }}
      reference_network_patch: ${{ inputs.run_player_reference_network_patch == true }}
      reference_missing_interface: ${{ inputs.run_player_reference_missing_interface == true }}
      reference_zero_interface: ${{ inputs.run_player_reference_zero_interface == true }}
      reference_valid_interface: ${{ inputs.run_player_reference_valid_interface == true }}

  # Baseline only. Source is a public related project, not claimed to be the
  # source of either existing pinned binary. No resulting .so is shipped.
  reference-kenji-source-build:
    if: github.event_name == 'workflow_dispatch' && inputs.run_reference_core_compile == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Fetch pinned research source
        run: |
          set -euo pipefail
          git init /tmp/reference-kenji
          git -C /tmp/reference-kenji remote add origin https://git.ryujinx.app/projects/Kenji-NX.git
          git -C /tmp/reference-kenji fetch --depth=1 origin 280c427c550c5fe3bcc46b378e06a9b90a7e6b09
          git -C /tmp/reference-kenji checkout --detach FETCH_HEAD
          test "$(git -C /tmp/reference-kenji rev-parse HEAD)" = 280c427c550c5fe3bcc46b378e06a9b90a7e6b09
          echo 'REFERENCE_SOURCE_ONLY_NOT_IDENTITY_PROOF'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: android-actions/setup-android@v4
      - name: Install Android NDK
        run: sdkmanager --install 'ndk;28.2.13676358'
      - name: Compile research baseline for ARM Android, no APK
        working-directory: /tmp/reference-kenji
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          clang --version | head -1
          dotnet --version
          mkdir -p /tmp/reference-core-output /tmp/reference-core-logs
          dotnet publish src/LibKenjinx/LibKenjinx.csproj -r linux-bionic-arm64 -c Release \
            -p:DisableUnsupportedError=true -p:PublishAotUsingRuntimePack=true \
            -p:CppCompilerAndLinker="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
            -p:StripSymbols=false -p:DefineConstants=ANDROID -o /tmp/reference-core-output \
            2>&1 | tee /tmp/reference-core-logs/compile.txt
          mapfile -t core < <(find /tmp/reference-core-output -maxdepth 1 -iname 'libkenjinx.so' -type f)
          [ "${#core[@]}" = 1 ] || { echo 'REFERENCE_CORE_OUTPUT_MISSING'; exit 1; }
          sha256sum "${core[0]}" | tee /tmp/reference-core-logs/sha256.txt
          llvm-readelf -h -l -d "${core[0]}" > /tmp/reference-core-logs/elf.txt
          llvm-nm -D --defined-only "${core[0]}" > /tmp/reference-core-logs/exports.txt
          grep -E 'javaInitialize|deviceInitialize|graphicsInitialize|deviceLoadDescriptor|updateUiHandler' /tmp/reference-core-logs/exports.txt || true
          echo 'REFERENCE_CORE_COMPILED_NOT_RELEASE_NOT_RUNTIME_TESTED'
      - name: Preserve research logs only, never the binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-core-build-logs-not-release
          path: /tmp/reference-core-logs/*.txt
          if-no-files-found: warn
          retention-days: 3
